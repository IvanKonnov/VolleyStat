}
function switchSet(idx){
  if (idx < 0 || idx >= formState.sets.length) return;
  formState.sets[formState.activeSetIdx] = readSetFields();
  formState.activeSetIdx = idx;
  renderSetChips();
  loadSetIntoFields(formState.sets[formState.activeSetIdx]);
  updatePreview();
  validateSet(formState.sets[formState.activeSetIdx], document.getElementById("matchForm"));
  scheduleSaveDraft();
}
function addSet(){
  if (formState.sets.length >= MAX_SETS) return;
  formState.sets[formState.activeSetIdx] = readSetFields();
  formState.sets.push(emptySet());
  formState.activeSetIdx = formState.sets.length - 1;
  renderSetChips(); loadSetIntoFields(formState.sets[formState.activeSetIdx]); updatePreview();
  validateSet(formState.sets[formState.activeSetIdx], document.getElementById("matchForm"));
  scheduleSaveDraft();
}
function duplicatePrevSet(){
  if (formState.activeSetIdx === 0) return;
  formState.sets[formState.activeSetIdx] = readSetFields();
  const prev = formState.sets[formState.activeSetIdx - 1];
  const copy = cloneSet(prev);
  copy.score_us = null; copy.score_them = null;
  formState.sets[formState.activeSetIdx] = copy;
  loadSetIntoFields(formState.sets[formState.activeSetIdx]);
  renderSetChips(); updatePreview();
  validateSet(formState.sets[formState.activeSetIdx], document.getElementById("matchForm"));
  scheduleSaveDraft();
  toast("Данные скопированы из сета " + formState.activeSetIdx);
}
function deleteCurrentSet(){
  if (formState.sets.length <= 1) return;
  const cur = formState.sets[formState.activeSetIdx];
  const m = metrics(cur);
  const hasData = m.points > 0 || cur.attack.total > 0 || cur.serve.total > 0 || cur.reception.total > 0;
  if (hasData && !confirm("Удалить Сет " + (formState.activeSetIdx+1) + " со всеми данными?")) return;
  formState.sets.splice(formState.activeSetIdx, 1);
  if (formState.activeSetIdx >= formState.sets.length) formState.activeSetIdx = formState.sets.length - 1;
  renderSetChips(); loadSetIntoFields(formState.sets[formState.activeSetIdx]); updatePreview();
  validateSet(formState.sets[formState.activeSetIdx], document.getElementById("matchForm"));
  scheduleSaveDraft();
  toast("Сет удалён", "ok");
}

function setPv(id, text, cls){
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "pv-value" + (cls ? " " + cls : "");
}
function updatePreview(){
  const cur = formState.sets[formState.activeSetIdx] || emptySet();
  const curM = metrics(cur);
  const curAttCls = num(cur.attack.total) > 0 ? effClass(curM.attEff) : "";
  const curAceCls = num(cur.serve.total) > 0 ? aceClass(curM.acePct) : "";
  const curPosCls = num(cur.reception.total) > 0 ? posClass(curM.goodPct) : "";
  setPv("pvCurAttEff", pct(curM.attEff), curAttCls);
  setPv("pvCurKillPct", pct(curM.killPct), "");
  setPv("pvCurAcePct", pct(curM.acePct), curAceCls);
  setPv("pvCurPosPct", pct(curM.goodPct), curPosCls);
  setPv("pvCurExcPct", pct(curM.excPct), "");
  setPv("pvCurPoints", String(curM.points), "");
  const tot = aggregateSets(formState.sets);
  const totM = metrics(tot);
  const totAttCls = num(tot.attack.total) > 0 ? effClass(totM.attEff) : "";
  const totAceCls = num(tot.serve.total) > 0 ? aceClass(totM.acePct) : "";
  const totPosCls = num(tot.reception.total) > 0 ? posClass(totM.goodPct) : "";
  setPv("pvTotAttEff", pct(totM.attEff), totAttCls);
  setPv("pvTotKillPct", pct(totM.killPct), "");
  setPv("pvTotAcePct", pct(totM.acePct), totAceCls);
  setPv("pvTotPosPct", pct(totM.goodPct), totPosCls);
  setPv("pvTotExcPct", pct(totM.excPct), "");
  setPv("pvTotPoints", String(totM.points), "");
}

function onSaveMatch(e){
  if (e) e.preventDefault();
  formState.sets[formState.activeSetIdx] = readSetFields();
  const hasOpponent = (formState.base.opponent || "").trim().length > 0;
  const hasAnyStat = formState.sets.some(s => {
    const m = metrics(s);
    return m.points > 0 || s.attack.total > 0 || s.serve.total > 0 || s.reception.total > 0;
  });
  const hasScore = formState.sets.some(s => s.score_us != null || s.score_them != null);
  if (!hasOpponent && !hasAnyStat && !hasScore){
    if (!confirm("Матч пустой (нет ни соперника, ни статистики). Всё равно сохранить?")) return;
  }
  const firstInvalidIdx = formState.sets.findIndex(s => !validateSetData(s));
  if (firstInvalidIdx >= 0){
    if (!confirm("В данных есть несоответствия. Сохранить всё равно?")) {
      formState.activeSetIdx = firstInvalidIdx;
      renderSetChips();
      loadSetIntoFields(formState.sets[firstInvalidIdx]);
      updatePreview();
      validateSet(formState.sets[firstInvalidIdx], document.getElementById("matchForm"));
      return;
    }
  }
  const matchRaw = {
    id: formState.editingId || uid(),
    date: formState.base.date,
    opponent: formState.base.opponent,
    location: formState.base.location,
    tournament: formState.base.tournament,
    sets_data: formState.sets.map(cloneSet),
    notes: formState.base.notes
  };
  const match = finalizeMatch(matchRaw);
  pushUndo(formState.editingId ? "Редактирование матча" : "Добавление матча");
  if (formState.editingId){
    const idx = state.matches.findIndex(m => m.id === formState.editingId);
    if (idx > -1){
      state.matches[idx] = match;
      toast("Матч обновлён", "ok");
    } else {
      toast("Исходный матч не найден — сохранён как новый", "err");
      state.matches.push(match);
    }
  } else {
    state.matches.push(match);
    toast("Матч добавлен · " + pluralSets(match.sets_data.length), "ok");
  }
  save();
  resetFormState();
  renderAll();
  renderFormMode(true);
  switchTab("matches");
}
function openFormForEdit(match){
  clearDraft();
  formState.editingId = match.id;
  formState.base = {
    date: match.date,
    opponent: match.opponent,
    location: match.location,
    tournament: match.tournament,
    notes: match.notes
  };
  formState.sets = (match.sets_data && match.sets_data.length ? match.sets_data : [emptySet()]).map(cloneSet);
  formState.activeSetIdx = 0;
  applyFormToDOM();
}
function openFormForDup(match){
  clearDraft();
  formState.editingId = null;
  formState.base = { date: todayISO(), opponent: match.opponent, location: match.location, tournament: match.tournament, notes: "" };
  formState.sets = [emptySet()];
  formState.activeSetIdx = 0;
  applyFormToDOM();
}

function preserveLiveNotesFocus(){

}

function startLiveSession(){
  const opp = document.getElementById("lOpponent").value.trim();
  const loc = document.getElementById("lLocation").value.trim();
  const tour = document.getElementById("lTournament").value.trim();
  const dt = document.getElementById("lDate").value || todayISO();
  const notes = (document.getElementById("lNotes")?.value || "").trim();

    base: { date: dt, opponent: opp, location: loc, tournament: tour, notes: notes },
    sets: [emptySet()],
    log: [],
    activeSetIdx: 0
  };
  saveLiveSession();
  renderLiveMode();
  toast("Матч начат. Тапай по кнопкам!", "ok");
}

const LIVE_ACTIONS = {
  att_kill:  { set:c => { c.attack.kills++;  c.attack.total++; c.score_us   = (c.score_us||0)+1; }, label:"Атака: убил",   cls:"good" },
  srv_ace:   { set:c => { c.serve.aces++;    c.serve.total++;  c.score_us   = (c.score_us||0)+1; }, label:"Подача: эйс",  cls:"good" },
  blk_kill:  { set:c => { c.block.kills++;                     c.score_us   = (c.score_us||0)+1; }, label:"Блок: очко",   cls:"good" },
  att_err:     { set:c => { c.attack.errors++;    c.attack.total++;    c.score_them = (c.score_them||0)+1; }, label:"Атака: ошибка",  cls:"bad" },
  att_blocked: { set:c => { c.attack.blocked++;   c.attack.total++;    c.score_them = (c.score_them||0)+1; }, label:"Атака: в блок",  cls:"bad" },
  srv_err:     { set:c => { c.serve.errors++;     c.serve.total++;     c.score_them = (c.score_them||0)+1; }, label:"Подача: ошибка", cls:"bad" },
  rec_err:     { set:c => { c.reception.errors++; c.reception.total++; c.score_them = (c.score_them||0)+1; }, label:"Приём: ошибка",  cls:"bad" },
  srv_ok:      { set:c => { c.serve.total++; },                          label:"Подача: в игре", cls:"" },
  rec_exc:     { set:c => { c.reception.excellent++; c.reception.total++; }, label:"Приём: отлично", cls:"good" },
  rec_pos:     { set:c => { c.reception.positive++;  c.reception.total++; }, label:"Приём: позитив", cls:"good" },
  rec_neutral: { set:c => { c.reception.neutral++;   c.reception.total++; }, label:"Приём: нейтрал", cls:"" },
  score_us:        { set:c => { c.score_us   = (c.score_us||0)+1; }, label:"Коррекция: +1 нам",  cls:"good" },
  score_them:      { set:c => { c.score_them = (c.score_them||0)+1; }, label:"Коррекция: +1 им", cls:"bad" },
  score_us_minus:  { set:c => { c.score_us   = Math.max(0,(c.score_us||0)-1); }, label:"Коррекция: −1 нам", cls:"" },
  score_them_minus:{ set:c => { c.score_them = Math.max(0,(c.score_them||0)-1); }, label:"Коррекция: −1 им",  cls:"" }
};

function liveAction(action){
  if (!liveState.session) return;
  if (action === "undo_last"){ undoLastLive(); return; }
  const def = LIVE_ACTIONS[action];
  if (!def) return;
  const setIdx = liveState.session.activeSetIdx;
  const cur = liveState.session.sets[setIdx];
  const snapshot = JSON.parse(JSON.stringify(cur));
  def.set(cur);
  liveState.session.log.push({
    time: new Date().toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit", second:"2-digit" }),
    label: def.label, cls: def.cls, action: action, setIdx: setIdx, snapshot: snapshot
  });
  saveLiveSession();
  scheduleRenderLiveMode();
}
function undoLastLive(){
  if (!liveState.session) return;
  const log = liveState.session.log;
  if (!log.length){ toast("Нечего отменять", "err"); return; }
  const last = log.pop();
  const setIdx = (typeof last.setIdx === "number" && last.setIdx >= 0 && last.setIdx < liveState.session.sets.length)
    ? last.setIdx
    : liveState.session.activeSetIdx;
  if (!liveState.session.sets[setIdx]){
    toast("Сет уже удалён", "err");
  } else if (last.snapshot){
    liveState.session.sets[setIdx] = normalizeSet(last.snapshot);
    toast("Отменено: " + last.label + (setIdx !== liveState.session.activeSetIdx ? " (в сете " + (setIdx+1) + ")" : ""));
  } else {
    toast("Отменено: " + last.label);
  }
  saveLiveSession();
  renderLiveMode();
}
function nextLiveSet(){
  if (!liveState.session) return;
  if (liveState.session.sets.length >= MAX_SETS){ toast("Достигнут максимум сетов", "err"); return; }
  liveState.session.sets.push(emptySet());
  liveState.session.activeSetIdx = liveState.session.sets.length - 1;
  saveLiveSession(); renderLiveMode();
  toast("Сет " + (liveState.session.activeSetIdx + 1) + " начат");
}
function abortLiveSession(){
  if (!liveState.session) return;
  if (!confirm("Отменить матч? Записанные данные будут потеряны.")) return;
  liveState.session = null;
  clearLiveSession();
  renderLiveMode();
  toast("Матч отменён", "ok");
}
function finishLiveSession(){
  if (!liveState.session) return;
  const session = liveState.session;
  const hasOpponent = (session.base.opponent || "").trim().length > 0;
  const hasAnyStat = session.sets.some(s => {
    const m = metrics(s);
    return m.points > 0 || s.attack.total > 0 || s.serve.total > 0 || s.reception.total > 0;
  });
  const hasScore = session.sets.some(s => s.score_us != null || s.score_them != null);
  if (!hasOpponent && !hasAnyStat && !hasScore){
    if (!confirm("Матч пустой (нет ни соперника, ни статистики). Всё равно сохранить?")) return;
  }
  const firstInvalidIdx = session.sets.findIndex(s => !validateSetData(s));
  if (firstInvalidIdx >= 0){
    if (!confirm("В данных есть несоответствия. Сохранить всё равно?")) return;
  }
  const matchRaw = {
    id: uid(),
    date: session.base.date,
    opponent: session.base.opponent,
    location: session.base.location,
    tournament: session.base.tournament,
    sets_data: session.sets.map(cloneSet),
    notes: session.base.notes || ""
  };
  const match = finalizeMatch(matchRaw);
  pushUndo("Live-матч");
  state.matches.push(match);
  save();
  liveState.session = null;
  clearLiveSession();
  renderAll();
  renderFormMode(true);
  toast("Матч сохранён · " + pluralSets(match.sets_data.length), "ok");
  switchTab("matches");
}

          '<button class="btn ghost" type="button" data-goto="add" data-mode="live" data-reset="1">🔴 Live-режим</button>' +
        '</div>' +
      '</div>';
    return;
  }

  const s = computeSeason(state.matches);
  const setStats = computeSetNumberStats(state.matches);
  const streaks = computeStreaks(state.matches);
  const records = computeRecords(state.matches);

  const allComputed = state.matches.map(computeMatch);
  const realMatches = state.matches.filter(hasRealData);
  const computedReal = realMatches.map(computeMatch);
  const realSets = realMatches.reduce((sum, m) => sum + statsSetsCount(m), 0);
  const realPoints = computedReal.reduce((sum, m) => sum + m.points, 0);
  const realAces = realMatches.reduce((sum, m) => sum + ((m.serve && m.serve.aces) || 0), 0);

  const achCtx = {
    matches: state.matches, season: s, computed: allComputed,
    realMatches: realMatches, computedReal: computedReal,
    realSets: realSets, realPoints: realPoints, realAces: realAces
  };
  const achUnlocked = ACHIEVEMENTS.filter(a => { try { return a.test(achCtx); } catch(e){ return false; } });

  let backupHtml = "";
  if (state.matches.length >= 3){
    const lastExport = state.settings.lastExportAt;
    const days = lastExport ? daysBetween(lastExport, todayISO()) : 999;
    if (!lastExport || days >= BACKUP_REMINDER_DAYS){
      backupHtml =
        '<div class="backup-reminder">' +
          '<span class="br-ico">💾</span>' +
          '<div class="br-body">' +
            '<div class="br-title">' + (lastExport ? "Вы давно не делали бэкап" : "Ещё не делали бэкап") + '</div>' +
            '<div class="br-text">' + (lastExport ? "Последний экспорт: " + fmtDateRu(lastExport) + " (" + days + " дн. назад). " : "") + "Данные хранятся только в браузере. Сделайте экспорт JSON, чтобы не потерять статистику.</div>" +
          '</div>' +
          '<button class="btn primary" type="button" id="btnBackupNow">Сделать</button>' +
        '</div>';
    }
  }

  const statsSets  = s.statsSets || 0;
  const scoredSets = s.setsWon + s.setsLost;
  const setsHint = scoredSets > 0
    ? "со счётом: " + scoredSets + (statsSets !== scoredSets ? ", со стат.: " + statsSets : "")
    : "счёт не заполнен";

  const wld = s.wins + "–" + s.losses + (s.matchesDrawCount ? "–" + s.matchesDrawCount : "");
  const wldHint = s.matchesWithScore || s.matchesDrawCount
    ? wld + (s.matchesWithScore ? " (" + pct0(s.winPct) + ")" : "")
    : "без счёта";

  const kpiList = [
    { label:"Матчей",               value:String(s.count), hint: wldHint },
    { label:"Сетов",                value:String(statsSets), hint: setsHint },
    { label:"Очков всего",          value:String(s.points), hint: "за сезон" },
    { label:"Очков за сет",         value:s.pointsPerSet.toFixed(1), hint: "по сетам со стат." },
    { label:"Эфф. атаки",           value:pct(s.attEff), hint: s.attack.total + " попыток", rating: s.attack.total > 0 ? rateMetric(s.attEff, "attEff") : null },
    { label:"Приём (+) или лучше",  value:pct(s.goodPct), hint: s.reception.total + " приёмов", rating: s.reception.total > 0 ? rateMetric(s.goodPct, "posPct") : null },
    { label:"Эйс %",                value:pct(s.acePct), hint: s.serve.aces + " эйсов", rating: s.serve.total > 0 ? rateMetric(s.acePct, "acePct") : null },
    { label:"Полезность",           value:s.pirAvg.toFixed(2), hint: "в среднем за сет со стат.", rating: s.statsSets > 0 ? rateMetric(s.pirAvg, "pir") : null }
  ];
  const kpiHtml = kpiList.map((k, i) => {
    const cls = i % 4 === 3 ? "blue" : i % 4 === 2 ? "green" : "";
    const ratingHtml = k.rating ? '<div><span class="rating ' + k.rating.cls + '">' + k.rating.label + '</span></div>' : "";
    return '<div class="kpi ' + cls + '">' +
      '<div class="label">' + k.label + '</div>' +
      '<div class="value">' + k.value + '</div>' +
      '<div class="hint-line">' + k.hint + '</div>' +
      ratingHtml +
    '</div>';
  }).join("");

  const last5 = allComputed.slice()
    .sort((a,b) => (b.date||"").localeCompare(a.date||"") || String(b.id).localeCompare(String(a.id)))
    .slice(0, 5);
  const avg = (arr, k) => arr.length ? arr.reduce((sum, x) => sum + x[k], 0) / arr.length : 0;
  const fAtt = avg(last5, "attEff");
  const fPos = avg(last5, "goodPct");
  const fPts = avg(last5, "points");
  let _sp = 0, _ss = 0;
  last5.forEach(m => { _sp += m.pir * m.statsSets; _ss += m.statsSets; });
  const fPIR = _ss > 0 ? _sp / _ss : 0;

  let setNumBlock = "";
  if (setStats.length >= 2){
    const rows = setStats.map(st =>
      '<div class="stat-row"><span class="k">' + st.label + ' <span class="muted">(' + st.count + ')</span></span>' +
      '<span class="v"><span class="badge ' + effClass(st.attEff) + '">' + pct(st.attEff) + '</span></span></div>'
    ).join("");
    setNumBlock =
      '<div class="card">' +
        '<div class="card-head"><span class="emoji">🎬</span><h3>Эфф. атаки по номерам сетов</h3></div>' +
        rows +
      '</div>';
  }

  const thPosUI = state.settings.thresholds.posPct.good;
  const streakList = [
    { n:streaks.win,      ico:"🏆", lbl:"побед подряд" },
    { n:streaks.eff30,    ico:"🔥", lbl:"матчей eff ≥ " + pct0(state.settings.thresholds.attEff.good) },
    { n:streaks.ace,      ico:"🎯", lbl:"матчей с эйсом" },
    { n:streaks.positive, ico:"🛡", lbl:"матчей приём ≥ " + pct0(thPosUI) }
  ];
  const activeStreaks = streakList.filter(x => x.n > 0);
  let streaksBlock = "";
  if (activeStreaks.length){
    streaksBlock =
      '<section class="analytics-section" style="margin-top:18px">' +
        '<div class="section-head"><h2>🔥 Текущие серии</h2></div>' +
        '<div class="streaks-grid">' +
          activeStreaks.map(x =>
            '<div class="streak-card"><div class="sk-ico">' + x.ico + '</div>' +
              '<div><div class="sk-num">' + x.n + '</div><div class="sk-lbl">' + x.lbl + '</div></div>' +
            '</div>'
          ).join("") +
        '</div>' +
      '</section>';
  }

  let recordsBlock = "";
  if (records){
    const cards = [];
    if (records.attEff) cards.push({ ico:"🔥", l:"Лучшая эфф. атаки", v:pct(records.attEff.attEff), h:fmtDateRu(records.attEff.date) + " · " + (records.attEff.opponent || "—") });
    if (records.posPct) cards.push({ ico:"🛡", l:"Лучший приём", v:pct(records.posPct.goodPct), h:fmtDateRu(records.posPct.date) + " · " + (records.posPct.opponent || "—") });
    if (records.points) cards.push({ ico:"🎯", l:"Больше всего очков", v:records.points.points, h:fmtDateRu(records.points.date) + " · " + (records.points.opponent || "—") });
    if (records.pir && Number.isFinite(records.pir.pir)) cards.push({ ico:"⭐", l:"Лучшая полезность", v:records.pir.pir.toFixed(2), h:fmtDateRu(records.pir.date) + " · " + (records.pir.opponent || "—") });
    if (cards.length){
      recordsBlock =
        '<section class="analytics-section" style="margin-top:18px">' +
          '<div class="section-head"><h2>🏅 Личные рекорды</h2></div>' +
          '<div class="records-grid">' +
            cards.map(c => '<div class="record-card"><div class="rc-ico">' + c.ico + '</div>' +
              '<div class="rc-body"><div class="rc-l">' + c.l + '</div><div class="rc-v">' + c.v + '</div><div class="rc-h">' + c.h + '</div></div></div>').join("") +
          '</div>' +
        '</section>';
    }
  }

  const goals = state.settings.goals;
  const thPosGoal = state.settings.thresholds.posPct.good;
  const goalsBlock =
    '<section class="analytics-section" style="margin-top:18px">' +
      '<div class="section-head"><h2>🎯 Цели на сезон</h2></div>' +
      '<div class="card">' +
        renderGoal("Эфф. атаки", s.attEff, goals.attEff, true) +
        renderGoal("Эйсов за сезон", s.serve.aces, goals.seasonAces, false) +
        renderGoal("Очков за сезон", s.points, goals.seasonPoints, false) +
        renderGoal("Матчей с приёмом ≥ " + pct0(thPosGoal),
          computedReal.filter(m => m.goodPct >= thPosGoal && m.reception.total >= 5).length,
          goals.matchesWithPos50, false) +
      '</div>' +
    '</section>';

  const achBlock =
    '<section class="analytics-section" style="margin-top:18px">' +
      '<div class="section-head"><h2>🏆 Достижения (' + achUnlocked.length + '/' + ACHIEVEMENTS.length + ')</h2></div>' +
      '<div class="achievements-grid">' +
        ACHIEVEMENTS.map(a => {
          const unlocked = achUnlocked.some(u => u.id === a.id);
          return '<div class="ach-card' + (unlocked ? '' : ' locked') + '">' +
            '<div class="ach-ico">' + (unlocked ? a.ico : "🔒") + '</div>' +
            '<div class="ach-name">' + a.name + '</div>' +
            '<div class="ach-desc">' + a.desc + '</div>' +
          '</div>';
        }).join("") +
      '</div>' +
    '</section>';

  const _srvEffRt = rateMetric(s.srvEff, "srvEff");
  const _srvErrRt = srvErrRating(s.srvErrPct);
  const _killRt   = rateMetric(s.killPct, "killPct");

  host.innerHTML =
    backupHtml +
    '<div class="kpi-grid">' + kpiHtml + '</div>' +
    '<div class="grid-2">' +
      '<div class="card">' +
        '<div class="card-head"><span class="emoji">🏐</span><h3>Атака</h3></div>' +
        statRow("Всего попыток", s.attack.total) +
        statRow("Очки (убил)", s.attack.kills) +
        statRow("Ошибки", s.attack.errors) +
        statRow("В блок", s.attack.blocked) +
        statRow("Эффективность", '<span class="badge ' + effClass(s.attEff) + '">' + pct(s.attEff) + '</span>') +
        statRow("% реализации", '<span class="badge ' + (_killRt ? _killRt.cls : "warn") + '">' + pct(s.killPct) + '</span>') +
        statRow("Попыток за сет", s.attPerSet.toFixed(1)) +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><span class="emoji">🎯</span><h3>Подача</h3></div>' +
        statRow("Всего подач", s.serve.total) +
        statRow("Эйсы", s.serve.aces) +
        statRow("Ошибки", s.serve.errors) +
        statRow("Эйс %", '<span class="badge ' + aceClass(s.acePct) + '">' + pct(s.acePct) + '</span>') +
        statRow("Эфф. подачи", '<span class="badge ' + (_srvEffRt ? _srvEffRt.cls : "warn") + '">' + pct(s.srvEff) + '</span>') +
        statRow("Ошибок подачи %", '<span class="badge ' + (_srvErrRt ? _srvErrRt.cls : "warn") + '">' + pct(s.srvErrPct) + '</span>') +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><span class="emoji">🛡</span><h3>Приём</h3></div>' +
        statRow("Всего приёмов", s.reception.total) +
        statRow("Позитив (+) — обычные", s.reception.positive) +
        statRow("Отличный (++) — идеальные", s.reception.excellent) +
        statRow("Нейтральные (○)", s.reception.neutral) +
        statRow("Ошибки", s.reception.errors) +
        statRow("Приём (+) или лучше %", '<span class="badge ' + posClass(s.goodPct) + '">' + pct(s.goodPct) + '</span>') +
        statRow("Отличный %", pct(s.excPct)) +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><span class="emoji">🧱</span><h3>Блок и форма</h3></div>' +
        statRow("Очки блоком за сезон", s.block.kills, "big") +
        statRow("Блок за сет", s.blockPerSet.toFixed(2)) +
        '<div class="section-title" style="margin:16px 0 6px">Форма — последние 5 матчей</div>' +
        statRow("Средняя эфф. атаки", '<span class="badge ' + effClass(fAtt) + '">' + pct(fAtt) + '</span>') +
        statRow("Средний приём (+) или лучше", '<span class="badge ' + posClass(fPos) + '">' + pct(fPos) + '</span>') +
        statRow("Средние очки за матч", fPts.toFixed(1)) +
        statRow("Средняя полезность", fPIR.toFixed(2)) +
      '</div>' +
      setNumBlock +
    '</div>' +
    streaksBlock + recordsBlock + goalsBlock + achBlock;

  const backupBtn = document.getElementById("btnBackupNow");
  if (backupBtn) backupBtn.addEventListener("click", exportJSON);
}

function renderGoal(label, current, target, isPercent){
  const ratio = target > 0 ? Math.min(1, current / target) : 0;
  const met = ratio >= 1;
  const display = isPercent
    ? pct(current) + " / " + pct(target)
    : String(Math.round(current)) + " / " + String(target);
  return '<div class="goal-row">' +
    '<div class="goal-head">' +
      '<span class="gh-l">' + label + '</span>' +
      '<span class="gh-v">' + display + '</span>' +
    '</div>' +
    '<div class="goal-track">' +
      '<div class="goal-fill' + (met ? ' met' : '') + '" style="width:' + (ratio * 100).toFixed(1) + '%"></div>' +
    '</div>' +
  '</div>';
}

   СПИСОК МАТЧЕЙ

function getFilteredMatches(){
  const q = (document.getElementById("matchSearch")?.value || "").trim().toLowerCase();
  let list = [...state.matches];
  if (q){
    list = list.filter(m =>
      (m.opponent||"").toLowerCase().includes(q) ||
      (m.tournament||"").toLowerCase().includes(q) ||
      (m.location||"").toLowerCase().includes(q) ||
      (m.notes||"").toLowerCase().includes(q)
    );
  }
  if (matchFilter === "win")  list = list.filter(m => {
    const r = matchResult(m);
    return r.valid && !r.partial && !r.draw && r.win;
  });
  if (matchFilter === "loss") list = list.filter(m => {
    const r = matchResult(m);
    return r.valid && !r.partial && !r.draw && !r.win;
  });
  list.sort((a,b) => (b.date||"").localeCompare(a.date||"") || String(b.id).localeCompare(String(a.id)));
  return list;
}

function renderMatches(){
  const host = document.getElementById("matchesTableHost");
  const counter = document.getElementById("matchesCount");
  if (!host) return;
  const list = getFilteredMatches();
  const total = state.matches.length;
  if (!list.length){
    host.innerHTML = '<div class="empty"><span class="icon">📋</span><h3>' +
      (total ? "Ничего не найдено" : "Список матчей пуст") + '</h3><p>' +
      (total ? "Попробуйте изменить фильтры или поисковый запрос." : "Добавьте первый матч, чтобы начать вести статистику.") + '</p>' +
      (total ? "" : '<button class="btn primary" type="button" data-goto="add" data-reset="1">➕ Добавить матч</button>') + '</div>';
  } else {
    host.innerHTML = isMobile() ? renderMatchesMobile(list) : renderMatchesDesktop(list);
  }
  if (counter) counter.textContent = "Всего матчей: " + total + (list.length !== total ? " · Показано: " + list.length : "");
  renderCompareBar();
  document.querySelectorAll("[data-filter]").forEach(b => {
    b.classList.toggle("active", b.dataset.filter === matchFilter);
  });
}

function renderCompareBar(){
  const host = document.getElementById("compareBarHost");
  if (!host) return;
  if (compareSelection.size < 2){ host.innerHTML = ""; return; }
  host.innerHTML =

function trapFocus(modal){
  const sel = 'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const focusables = modal.querySelectorAll(sel);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  modalKeyHandler = (e) => {
    if (e.key !== "Tab") return;
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
  modal.addEventListener("keydown", modalKeyHandler);
}
function openModal(trigger){
  modalTrigger = trigger || null;
  document.getElementById("modalOverlay").hidden = false;
  document.body.classList.add("modal-open");
  document.body.style.overflow = "hidden";
  const modal = document.querySelector(".modal");
  if (modal) trapFocus(modal);
}
function closeModal(){
  const modal = document.querySelector(".modal");
  if (modal && modalKeyHandler){
    modal.removeEventListener("keydown", modalKeyHandler);
    modalKeyHandler = null;
  }
  document.getElementById("modalOverlay").hidden = true;
  document.body.classList.remove("modal-open");
  document.body.style.overflow = "";
  if (modalTrigger && document.contains(modalTrigger)){ try { modalTrigger.focus(); } catch(e){} }
  modalTrigger = null;
}

function copyMatchToClipboard(m){
  const cm = computeMatch(m);
  const r = cm.result;
  const lines = [];
  lines.push("🏐 " + fmtDateRu(m.date) + " · " + (m.opponent || "—"));
  if (m.location || m.tournament) lines.push([m.location, m.tournament].filter(Boolean).join(" · "));
  if (r.valid){
    const marker = r.partial ? " [неполный]" : (r.shortMatch ? " [короткий]" : "");
    const resWord = r.partial ? "" : (r.draw ? " (ничья)" : (r.win ? " (победа)" : " (поражение)"));
    lines.push("Счёт: " + r.label + resWord + marker);
  }
  lines.push("Атака: " + cm.attack.kills + "/" + cm.attack.total + " (eff " + pct(cm.attEff) + ", реализ. " + pct(cm.killPct) + ")");
  lines.push("Подача: " + cm.serve.aces + " эйсов / " + cm.serve.total + " (эйс " + pct(cm.acePct) + ", эфф " + pct(cm.srvEff) + ", ош " + pct(cm.srvErrPct) + ")");
  lines.push("Приём: обычн " + cm.reception.positive + ", отл " + cm.reception.excellent + ", нейтр " + cm.reception.neutral + ", ош " + cm.reception.errors + " / " + cm.reception.total + " (приём+ " + pct(cm.goodPct) + ")");
  lines.push("Блок: " + cm.block.kills + " очков");
  lines.push("Очки: " + cm.points + " · Полезность: " + cm.pir.toFixed(2));
  if (m.sets_data.length > 1){
    lines.push("");
    lines.push("По сетам:");
    cm.setMetrics.forEach(s => {
      const su = scoreUs(s.raw), st = scoreThem(s.raw);
      const scoreStr = (su != null && st != null) ? (su + ":" + st + " ") : "";
      lines.push("  Сет " + s.idx + ": " + scoreStr + s.points + " очк. (eff " + pct(s.attEff) + ")");
    });
  }
  const text = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast("Скопировано в буфер", "ok")).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Скопировано", "ok"); }
  catch (e){ toast("Не удалось скопировать", "err"); }
  ta.remove();
}

function openCompareModal(){
  [...compareSelection].forEach(id => { if (!state.matches.some(m => m.id === id)) compareSelection.delete(id); });
  const ids = [...compareSelection];
  const matches = ids.map(id => state.matches.find(m => m.id === id)).filter(Boolean).map(computeMatch);
  if (matches.length < 2){ toast("Выберите хотя бы 2 матча", "err"); renderMatches(); return; }

  const metricsList = [
    { key:"points",  label:"Очки",                 fmt:v => String(v) },
    { key:"attEff",  label:"Эфф. атаки",           fmt:v => pct(v) },
    { key:"killPct", label:"% реализации",         fmt:v => pct(v) },
    { key:"goodPct", label:"Приём (+) или лучше",  fmt:v => pct(v) },
    { key:"posPct",  label:"Обычный позитив (+)",  fmt:v => pct(v) },
    { key:"excPct",  label:"Отличный (++)",        fmt:v => pct(v) },
    { key:"acePct",  label:"Эйс %",                fmt:v => pct(v) },
    { key:"pir",     label:"Полезность",           fmt:v => Number.isFinite(v) ? v.toFixed(2) : "—" }
  ];

  const headerCols = matches.map(m =>
    '<th>' + fmtDateRu(m.date) + '<br><span class="muted" style="font-weight:600">' + esc(m.opponent || "—") + '</span></th>'
  ).join("");

  const rows = metricsList.map(mt => {
    const values = matches.map(x => x[mt.key]).filter(x => Number.isFinite(x));
    const max = values.length ? Math.max(...values) : null;
    const cells = matches.map(m => {
      const v = m[mt.key];
      const val = mt.fmt(v);
      const isMax = Number.isFinite(v) && values.length > 1 && v === max;
      return '<td style="' + (isMax ? 'color:var(--green);font-weight:800' : '') + '">' + val + '</td>';
    }).join("");
    return '<tr><td class="metric-l">' + mt.label + '</td>' + cells + '</tr>';
  }).join("");

  document.getElementById("modalDate").textContent = "Сравнение матчей";
  document.getElementById("modalTitle").textContent = pluralMatches(matches.length) + " — сравнение";
  document.getElementById("modalMeta").innerHTML = "";
  document.getElementById("modalBody").innerHTML =
    '<div style="overflow-x:auto"><table class="compare-table">' +
      '<thead><tr><th>Метрика</th>' + headerCols + '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>';
  document.getElementById("modalFooter").innerHTML = '<button class="btn" type="button" id="btnCloseCompare">Закрыть</button>';
  document.getElementById("btnCloseCompare").addEventListener("click", closeModal);
  openModal(null);
}

function buildPerPositionBlock(position){
  const metricLabels = {
    attEff: "Эфф. атаки",
    killPct: "% реализации",
    posPct: "Приём (+) или лучше",
    excPct: "Отличный приём (++)",
    srvEff: "Эфф. подачи",
    srvErrPct: "Ошибок подачи %",
    acePct: "Эйс %",
    pir: "Полезность"
  };
  const allowed = POSITION_METRICS[position] || POSITION_METRICS["Доигровщик"];
  const order = ["attEff","killPct","posPct","excPct","srvEff","srvErrPct","acePct","pir"];

  const rows = order.filter(k => allowed.includes(k)).map(key => {
    if (key === "srvErrPct"){
      const t = NORMS.srvErrPct[position];
      if (!t) return "";
      return '<tr>' +
        '<td>Ошибок подачи %</td>' +
        '<td>≥ ' + (t.bad*100).toFixed(0) + '%</td>' +
        '<td>' + (t.low*100).toFixed(0) + '–' + (t.bad*100).toFixed(0) + '%</td>' +
        '<td>' + (t.avg*100).toFixed(0) + '–' + (t.low*100).toFixed(0) + '%</td>' +
        '<td>' + (t.good*100).toFixed(0) + '–' + (t.avg*100).toFixed(0) + '%</td>' +
        '<td>&lt; ' + (t.good*100).toFixed(0) + '%</td>' +
      '</tr>';
    }
    if (key === "excPct"){
      return '<tr>' +
        '<td>' + metricLabels.excPct + '</td>' +
        '<td colspan="5" class="muted" style="font-weight:500">Справочная доля отличных от всех приёмов. Оценивается в составе «Приём (+) или лучше».</td>' +
      '</tr>';
    }
    const t = NORMS[key] && NORMS[key][position];
    if (!t) return "";
    const fmt = key === "pir"
      ? v => String(v)
      : v => (v*100).toFixed(0) + "%";
    const plus = key === "pir" ? "" : "+";
    return '<tr>' +
      '<td>' + metricLabels[key] + '</td>' +
      '<td>&lt; ' + fmt(t.bad) + '</td>' +
      '<td>' + fmt(t.bad) + ' – ' + fmt(t.low) + '</td>' +
      '<td>' + fmt(t.low) + ' – ' + fmt(t.avg) + '</td>' +
      '<td>' + fmt(t.avg) + ' – ' + fmt(t.good) + '</td>' +
      '<td>' + fmt(t.good) + plus + '</td>' +
    '</tr>';
  }).join("");

  return '<h4>' + esc(position) + '</h4>' +
    '<table class="norms-table">' +
      '<thead><tr><th>Метрика</th><th>Плохо</th><th>Ниже среднего</th><th>Средне</th><th>Хорошо</th><th>Отлично</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

      <h3>Статистика по разделам</h3>
      <div class="help-grid-2">
        <div class="hg-item"><b>🏐 Атака</b>Всего попыток, очки (убил), ошибки, попадания в блок.</div>
        <div class="hg-item"><b>🎯 Подача</b>Всего подач, эйсы, ошибки.</div>
        <div class="hg-item"><b>🛡 Приём</b>Всего, позитив (+), отличный (++), <strong>нейтральные (○)</strong>, ошибки.</div>
        <div class="hg-item"><b>🧱 Блок</b>Только очки блоком за сет.</div>
      </div>

      <h3>Про приём — важное</h3>
      <p>Категории приёма — <strong>разные</strong>. Каждый приём относится ровно к одной из четырёх групп:</p>
      <ul>
        <li>Отличный (++) — идеальный приём</li>
        <li>Позитив (+) — обычный хороший приём</li>
        <li>Нейтральные (○) — приём не в плюс, но и не ошибка</li>
        <li>Ошибки — потеря мяча на приёме</li>
      </ul>
      <p>Проверка: <strong>Позитив + Отличный + Нейтральные + Ошибки ≤ Всего приёмов</strong>.</p>
      <div class="help-example">
        <strong>Пример:</strong> всего 10 приёмов: 3 отличных, 2 просто хороших, 4 нейтральных, 1 ошибка. Вводите: «Позитив (+)» — <strong>2</strong>, «Отличный (++)» — <strong>3</strong>, «Нейтральные (○)» — <strong>4</strong>, «Ошибки» — <strong>1</strong>. Сумма = 10.
      </div>
      <p>Основная метрика приёма — <strong>«Приём (+) или лучше» = (Позитив + Отличный) / Всего</strong>. Это стандартная волейбольная метрика «позитивный приём».</p>

      <h3>Валидация полей</h3>
      <p>Поля с некорректными данными подсвечиваются <span style="color:var(--red)">красным</span>:</p>
      <ul>
        <li><strong>Атака:</strong> Очки + Ошибки + В блок ≤ Всего попыток.</li>
        <li><strong>Подача:</strong> Эйсы + Ошибки ≤ Всего подач.</li>
        <li><strong>Приём:</strong> Позитив + Отличный + Нейтральные + Ошибки ≤ Всего приёмов.</li>
      </ul>

      <h3>Черновик</h3>
      <p>Черновик сохраняется при любых ненулевых данных — даже если очков пока нет.</p>
    </section>

    <section class="help-section" id="help-live">
      <h2><span class="hn">3</span>Live-режим</h2>
      <p>Вкладка <em>➕ Запись</em> → <strong>«🔴 Live-режим»</strong>. Тапай по большим кнопкам прямо во время игры.</p>

      <h3>Автоматический счёт</h3>
      <ul>
        <li><strong>Наши очки</strong> (Убил, Эйс, Блок: очко) → <strong>+1 нам</strong>.</li>
        <li><strong>Наши ошибки</strong> (Ошибка атаки, в блок, ошибка подачи, ошибка приёма) → <strong>+1 сопернику</strong>.</li>
        <li><strong>Нейтральные</strong> (Подача: в игре; Приём: отлично / позитив / нейтрал) — счёт не меняют.</li>
        <li><strong>Ошибки соперника</strong> и <strong>судейские</strong> — только вручную через «Коррекция».</li>
      </ul>

      <h3>Важно про «Подача: в игре»</h3>
      <p>Кнопка только засчитывает попытку подачи (для статистики), но не даёт очко. После неё отметь результат розыгрыша кнопками «Убил / Ошибка / В блок / Приём» — очко начислится автоматически. Если розыгрыш закончился ошибкой соперника или судейским решением — используй «Коррекция: +1 нам».</p>

      <h3>Приём — четыре кнопки</h3>
      <ul>
        <li>«Отлично» (++) — идеальный приём.</li>
        <li>«Позитив» (+) — обычный хороший.</li>
        <li>«Нейтрал» (○) — не в успех и не в ошибку.</li>
        <li>«Ошибка» — потеря мяча (+1 им).</li>
      </ul>

      <h3>Автосохранение</h3>
      <p>Live-сессия сохраняется автоматически: как при первом тапе, так и сразу после ввода соперника/локации/турнира. Если случайно закроете браузер — при следующем запуске увидите тост «Найдена незавершённая Live-сессия».</p>
    </section>

    <section class="help-section" id="help-analytics">
      <h2><span class="hn">4</span>Аналитика</h2>
      <p>Вкладка <em>📈 Аналитика</em>. Для графиков — минимум <strong>2 матча</strong>, для трендов — минимум <strong>5 матчей</strong>.</p>

      <h3>Про метрики</h3>
      <ul>
        <li><strong>Приём (+) или лучше</strong> — основная метрика приёма = (Позитив + Отличный) / Всего.</li>
        <li><strong>Обычный позитив (+)</strong> — отдельная подметрика, без отличных.</li>
        <li><strong>Нейтральные (○)</strong> — приёмы «не в плюс и не в ошибку».</li>
        <li><strong>Ошибок подачи %</strong> — обратная метрика: чем меньше, тем лучше.</li>
      </ul>

      <h3>Про «сет со статистикой»</h3>
      <p>Средние «за сет» (очки, блоки, попытки, полезность, PIR) считаются по <strong>сетам со статистикой</strong>. Score-only сеты не размывают средние. Везде (KPI, карточки, модалка) показывается именно это число.</p>

      <h3>Про PIR за сезон</h3>
      <p>Средний PIR — это <strong>общее число PIR-очков, делённое на общее число сетов со статистикой</strong>. Нейтральные приёмы PIR не изменяют. Для либеро атака/подача/блок отсутствуют (по правилам), поэтому вклад PIR состоит только из приёма.</p>

      <h3>Формулы</h3>
      <div class="help-example">
        <strong>Эфф. атаки</strong> = (очки − ошибки − в блок) / всего попыток<br>
        <strong>% реализации</strong> = очки / всего попыток<br>
        <strong>Эйс %</strong> = эйсы / всего подач<br>
        <strong>Эфф. подачи</strong> = (эйсы − ошибки) / всего подач<br>
        <strong>Ошибок подачи %</strong> = ошибки / всего подач (меньше = лучше)<br>
        <strong>Приём (+) или лучше %</strong> = (позитив + отличные) / всего приёмов<br>
        <strong>Отличный %</strong> = отличные / всего приёмов<br>
        <strong>Нейтральные %</strong> = нейтральные / всего приёмов<br>
        <strong>Очки всего</strong> = очки атаки + эйсы + блоки<br>
        <strong>Очков за сет</strong> = очки всего / число СЕТОВ СО СТАТИСТИКОЙ<br>
        <strong>Блок за сет</strong> = очки блоком / число СЕТОВ СО СТАТИСТИКОЙ<br>
        <strong>Полезность (PIR)</strong> = (очки + эйсы + блоки + 0.5·отличные + 0.25·обычный позитив − ошибки атаки − ошибки подачи − ошибки приёма − в блок) / число СЕТОВ СО СТАТИСТИКОЙ
      </div>

      <h3>Победы, поражения, ничьи</h3>
      <p>Победы и поражения — только у матчей с заполненным счётом во всех сыгранных сетах. Ничьи (равный счёт по сетам) и неполные матчи не идут в эти категории и не продлевают серию побед.</p>

      <h3>Как читать Полезность</h3>
      <ul>
        <li><strong>&lt; 0</strong> — матч «в минус».</li>
        <li><strong>0–5</strong> — ниже среднего.</li>
        <li><strong>5–10</strong> — средне.</li>
        <li><strong>10–15</strong> — хорошо.</li>
        <li><strong>15+</strong> — отлично.</li>
      </ul>
    </section>

function switchTab(name){
  if (tabSwitching) return;
  tabSwitching = true;
  try {
    document.querySelectorAll(".tab").forEach(btn => {
      const on = btn.dataset.tab === name;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
      btn.setAttribute("tabindex", on ? "0" : "-1");
    });
    document.querySelectorAll("#bottomNav button").forEach(btn => {
      const on = btn.dataset.tab === name;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
    document.querySelectorAll(".tab-panel").forEach(panel => {
      panel.classList.toggle("active", panel.id === "tab-" + name);
    });
    if (name === "analytics") renderAnalytics();
    if (name === "dashboard") renderDashboard();
    if (name === "settings")  renderSettings();
    if (name === "matches")   renderMatches();
    if (name === "help")      renderHelp();
  } finally {
    tabSwitching = false;
  }
}
function setRecordMode(mode){
  const live = (mode === "live");
  document.body.classList.toggle("live-mode-active", live);
  document.getElementById("modeFormBtn").classList.toggle("active", !live);
  document.getElementById("modeLiveBtn").classList.toggle("active", live);
  document.getElementById("formModeHost").style.display = live ? "none" : "block";
  document.getElementById("liveModeHost").style.display = live ? "block" : "none";
  if (live) renderLiveMode();
  else renderFormMode(false);
}

function download(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}
function exportJSON(){
  const payload = {
    app: "volleyball_tracker",
    version: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    matches: state.matches,
    directories: state.directories,
    profile: state.profile,
    settings: state.settings
  };
  try {
    download("volleystat_backup_" + todayISO() + ".json", JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
    state.settings.lastExportAt = todayISO();
    save();
    renderDashboard();
    updateLastExportRow();
    toast("Экспорт JSON готов", "ok");
  } catch (e){ toast("Не удалось выполнить экспорт", "err"); }
}

  const s = String(v == null ? "" : v);
  if (/[";\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

      resultStr = r.partial ? ("partial " + r.label)
                : r.draw ? ("draw " + r.label)
                : ((r.win ? "W " : "L ") + r.label);
    }
    const completeness = r.valid ? (r.partial ? "partial" : "full") : "";
    const shortFlag = r.valid && r.shortMatch ? "short" : "";
    const drawFlag = r.valid && r.draw ? "draw" : "";
    (m.sets_data || []).forEach((s, i) => {
      const c = metrics(s);
      rows.push([
        m.date, m.opponent, m.location, m.tournament, i + 1,
        s.score_us == null ? "" : s.score_us,
        s.score_them == null ? "" : s.score_them,
        s.attack.total, s.attack.kills, s.attack.errors, s.attack.blocked, dec(c.attEff), dec(c.killPct),
        s.serve.total, s.serve.aces, s.serve.errors, dec(c.acePct), dec(c.srvEff), dec(c.srvErrPct),
        s.reception.total, s.reception.positive, s.reception.excellent, s.reception.neutral, s.reception.errors,
        dec(c.goodPct), dec(c.excPct), dec(c.neutralPct),
        s.block.kills, c.points,
        i === 0 ? np.toFixed(2) : "",
        i === 0 ? resultStr : "",
        i === 0 ? completeness : "",
        i === 0 ? shortFlag : "",
        i === 0 ? drawFlag : "",
        i === 0 ? m.notes : ""
      ].map(csvCell).join(";"));
    });
  });
  const csv = "\ufeff" + [header.join(";")].concat(rows).join("\r\n");
  try {
    download("volleystat_matches_" + todayISO() + ".csv", csv, "text/csv;charset=utf-8");
    state.settings.lastExportAt = todayISO();
    save();
    renderDashboard();
    updateLastExportRow();
    toast("Экспорт CSV готов", "ok");
  } catch (e){ toast("Не удалось выполнить экспорт", "err"); }
}
function pickFile(callback){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.style.position = "fixed";
  input.style.left = "-9999px";
  input.style.top = "0";
  input.style.width = "1px";
  input.style.height = "1px";
  input.style.opacity = "0";
  document.body.appendChild(input);
  input.addEventListener("change", () => {
    if (input.files && input.files[0]) callback(input.files[0]);
    setTimeout(() => input.remove(), 100);
  });
  input.click();
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(String(reader.result)); }
    catch (e){ toast("Файл не является корректным JSON", "err"); return; }
    if (!data || typeof data !== "object" || !Array.isArray(data.matches)){
      toast("Неверный формат: отсутствует массив matches", "err"); return;
    }
    if (data.app && data.app !== "volleyball_tracker" && data.app !== "volleyball_tracker_v1"){
      if (!confirm("Файл помечен как «" + data.app + "». Продолжить импорт?")) return;
    }
    if (!confirm("Импортировать " + data.matches.length + " матч(ей)? Текущие данные будут полностью заменены.")) return;
    pushUndo("Импорт");
    state = normalizeState(data);
    compareSelection.clear();
    save();
    applyTheme(state.settings.theme);
    resetFormState();
    liveState.session = null;
    clearLiveSession();
    invalidateHelp();
    renderAll();
    renderFormMode(true);
    toast("Импорт завершён: " + state.matches.length + " матч(ей)", "ok");
  };
  reader.onerror = () => toast("Ошибка чтения файла", "err");
  reader.readAsText(file, "utf-8");
}

/* ============================================================
   PWA
   ============================================================ */
function buildIcon(size){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, size, size);
  const cx = size/2, cy = size/2, r = size * 0.34;
  const grad = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  grad.addColorStop(0, "#fb923c");
  grad.addColorStop(1, "#ea580c");
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = Math.max(2, size * 0.03);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - r, cy - r*0.3);
  ctx.quadraticCurveTo(cx, cy - r*0.2, cx + r, cy - r*0.3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - r*0.5, cy - r);
  ctx.quadraticCurveTo(cx - r*0.2, cy, cx - r*0.5, cy + r);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + r*0.5, cy - r);
  ctx.quadraticCurveTo(cx + r*0.2, cy, cx + r*0.5, cy + r);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - r, cy + r*0.3);
  ctx.quadraticCurveTo(cx, cy + r*0.4, cx + r, cy + r*0.3);
  ctx.stroke();
  return c.toDataURL("image/png");
}
function registerPWA(){
  try {
    const icon192 = buildIcon(192);
    const icon512 = buildIcon(512);
    const fav = document.getElementById("faviconLink");
    if (fav) fav.href = icon192;
    const apple = document.getElementById("appleIconLink");
    if (apple) apple.href = icon192;
    const manifest = {
      name: "VolleyStat",
      short_name: "VolleyStat",
      start_url: location.pathname + location.search,
      display: "standalone",
      orientation: "portrait",
      background_color: "#f4f6fb",
      theme_color: "#f97316",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const mStr = JSON.stringify(manifest);
    const mUrl = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(mStr);
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = mUrl;
    document.head.appendChild(link);
  } catch (e){}
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
function bindEvents(){
  const tabNav = document.getElementById("tabNav");
  tabNav.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
  tabNav.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "Home" && e.key !== "End") return;
    e.preventDefault();
    const tabs = [...tabNav.querySelectorAll(".tab")];
    const cur = tabs.findIndex(t => t.classList.contains("active"));
    let next;
    if (e.key === "ArrowRight") next = (cur + 1) % tabs.length;
    else if (e.key === "ArrowLeft") next = (cur - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") next = 0;
    else next = tabs.length - 1;
    tabs[next].focus();
    tabs[next].click();
  });
  const bottomNav = document.getElementById("bottomNav");
  bottomNav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
  document.getElementById("btnHelp").addEventListener("click", () => switchTab("help"));
  document.getElementById("btnThemeToggle").addEventListener("click", () => {
    state.settings.theme = state.settings.theme === "light" ? "dark" : "light";
    applyTheme(state.settings.theme);
    save();
    const sw = document.getElementById("themeSwitch");
    if (sw) sw.checked = (state.settings.theme === "dark");
  });
  document.getElementById("btnExportJson").addEventListener("click", exportJSON);
  document.getElementById("btnExportCsv").addEventListener("click", exportCSV);
  document.getElementById("btnImport").addEventListener("click", () => { pickFile(importJSON); });
  document.getElementById("modeFormBtn").addEventListener("click", () => setRecordMode("form"));
  document.getElementById("modeLiveBtn").addEventListener("click", () => setRecordMode("live"));
  document.getElementById("matchSearch").addEventListener("input", () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(renderMatches, 150);
  });
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => { matchFilter = btn.dataset.filter; renderMatches(); });
  });

  document.getElementById("matchesTableHost").addEventListener("click", e => {
    const cb = e.target.closest("[data-cb-id]");
    if (cb){
      e.stopPropagation();
      const id = cb.dataset.cbId;
      if (compareSelection.has(id)) compareSelection.delete(id);
      else {
        if (compareSelection.size >= 4){ toast("Максимум 4 матча", "err"); return; }
        compareSelection.add(id);
      }
      renderMatches();
      return;
    }
    const btn = e.target.closest("[data-action]");
    if (btn){
      e.stopPropagation();
      const id = btn.dataset.id;
      const match = state.matches.find(m => m.id === id);
      if (!match) return;
      const action = btn.dataset.action;
      if (action === "details"){ openMatchDetail(id, btn); return; }
      if (action === "dup"){
        openFormForDup(match);
        switchTab("add");
        setRecordMode("form");
        toast("Заполни статистику и сохрани как новый матч", "ok");
        return;
      }
      if (action === "edit"){
        openFormForEdit(match);
        switchTab("add");
        setRecordMode("form");
        requestAnimationFrame(() => {
          const el = document.getElementById("mOpponent");
          if (el){ try { el.focus(); } catch(e){} }
        });
        return;
      }
      if (action === "del"){
        const label = (match.opponent ? "против «" + match.opponent + "» " : "") + "от " + fmtDateRu(match.date);
        if (!confirm("Удалить матч " + label + "?")) return;
        pushUndo("Удаление матча");
        state.matches = state.matches.filter(m => m.id !== id);
        compareSelection.delete(id);
        if (formState.editingId === id) resetFormState();
        save(); renderAll();
        toast("Матч удалён", "ok", { label:"Отменить", onClick: undo });
      }
      return;
    }
    const row = e.target.closest("[data-open]");
    if (row && row.dataset.open){ openMatchDetail(row.dataset.open, row); }
  });

  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", e => {
    if (e.target.id === "modalOverlay") closeModal();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !document.getElementById("modalOverlay").hidden){ closeModal(); return; }
    const tag = (e.target.tagName || "").toLowerCase();
    const inField = tag === "input" || tag === "textarea" || tag === "select";
    if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey && !inField){ e.preventDefault(); undo(); return; }
    if (e.altKey && (e.key === "n" || e.key === "т")){
      e.preventDefault(); resetFormState(); renderFormMode(true); switchTab("add"); setRecordMode("form"); return;
    }
    if (e.altKey && (e.key === "l" || e.key === "д")){
      e.preventDefault(); switchTab("add"); setRecordMode("live"); return;
    }
  });

  document.getElementById("tab-settings").addEventListener("click", e => {
    if (e.target.closest("#btnSaveProfile")){
      pushUndo("Профиль");
      state.profile = {
        player: document.getElementById("pPlayer").value.trim(),
        team:   document.getElementById("pTeam").value.trim(),
        position: document.getElementById("pPosition").value
      };
      save(); renderHeader(); renderDashboard(); toast("Профиль сохранён", "ok"); return;
    }
    if (e.target.closest("#btnSaveThresholds")){
      const read = id => {
        const v = Number(document.getElementById(id).value);
        if (!Number.isFinite(v)) return null;
        return safeRatio(v / 100);
      };
      const attG = read("thAttGood"), attB = read("thAttBad");
      const posG = read("thPosGood"), posB = read("thPosBad");
      const aceG = read("thAceGood"), aceB = read("thAceBad");
      if (attG == null || attB == null || posG == null || posB == null || aceG == null || aceB == null){
        toast("Введите числа во все поля", "err"); return;
      }
      if (attG <= attB || posG <= posB || aceG <= aceB){
        toast("«Хорошо» должно быть больше «плохо»", "err"); return;
      }
      pushUndo("Пороги");
      state.settings.thresholds = {
        attEff: { good: attG, bad: attB },
        posPct: { good: posG, bad: posB },
        acePct: { good: aceG, bad: aceB }
      };
      save(); renderAll(); toast("Пороги сохранены", "ok"); return;
    }
    if (e.target.closest("#btnSaveGoals")){
      const readPct = id => {
        const v = Number(document.getElementById(id).value);
        return Number.isFinite(v) ? safeRatio(v / 100) : null;
      };
      const readCount = id => {
        const v = Number(document.getElementById(id).value);
        return Number.isFinite(v) && v >= 0 ? Math.floor(v) : null;
      };
      const attEff = readPct("goalAttEff");
      const seasonAces = readCount("goalAces");
      const seasonPoints = readCount("goalPoints");
      const matchesWithPos50 = readCount("goalMatches");
      if (attEff == null || seasonAces == null || seasonPoints == null || matchesWithPos50 == null){
        toast("Введите корректные числа", "err"); return;
      }
      pushUndo("Цели");
      state.settings.goals = { attEff, seasonAces, seasonPoints, matchesWithPos50 };
      save(); renderDashboard(); toast("Цели сохранены", "ok"); return;
    }
    if (e.target.closest("#btnSavePirWeights")){
      const we = Number(document.getElementById("pwExcellent").value);
      const wp = Number(document.getElementById("pwPositive").value);
      if (!Number.isFinite(we) || !Number.isFinite(wp) || we < 0 || wp < 0){
        toast("Введите неотрицательные числа", "err"); return;
      }
      pushUndo("Веса PIR");
      state.settings.pirWeights = { excellent: we, positiveRegular: wp };
      save(); renderAll(); toast("Веса PIR сохранены", "ok"); return;
    }
    if (e.target.closest("#btnExportJson2")){ exportJSON(); return; }
    if (e.target.closest("#btnExportCsv2")){ exportCSV(); return; }
    if (e.target.closest("#btnWipeAll")){
      if (!confirm("Удалить ВСЕ данные: матчи, профиль, справочники, настройки?")) return;
      if (!confirm("Точно? Действие необратимо.")) return;
      pushUndo("Удаление всего");
      state = createDefaultState();
      compareSelection.clear();
      liveState.session = null;
      clearLiveSession();
      applyTheme(state.settings.theme);
      save(); resetFormState(); invalidateHelp(); renderAll(); renderFormMode(true);
      toast("Все данные удалены", "err"); return;
    }
    const rm = e.target.closest("[data-remove-dir]");
    if (rm){
      const key = rm.dataset.removeDir, value = rm.dataset.value;
      pushUndo("Удаление из справочника");
      state.directories[key] = state.directories[key].filter(v => v !== value);
      save(); renderSettings(); fillDatalists();
      toast("Удалено", "ok"); return;
    }
    const add = e.target.closest("[data-add-dir]");
    if (add){
      const key = add.dataset.addDir;
      const input = document.getElementById("input-" + key);
      const value = input.value.trim();
      if (!value){ toast("Введите значение", "err"); input.focus(); return; }
      if (state.directories[key].includes(value)){ toast("Уже есть", "err"); input.focus(); return; }
      pushUndo("Добавление в справочник");
      state.directories[key].push(value);
      save(); renderSettings(); fillDatalists();
      toast("Добавлено в «" + DIR_LABELS[key] + "»", "ok");
      const fresh = document.getElementById("input-" + key);
      if (fresh) fresh.focus();
    }
  });

  document.getElementById("tab-settings").addEventListener("change", e => {
    if (e.target.id === "themeSwitch"){
      state.settings.theme = e.target.checked ? "dark" : "light";
      applyTheme(state.settings.theme);
      save();
    }
  });

  document.getElementById("tab-settings").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const input = e.target.closest('input[id^="input-"]');
    if (!input) return;
    e.preventDefault();
    const key = input.id.replace("input-", "");
    const btn = document.querySelector('[data-add-dir="' + key + '"]');
    if (btn) btn.click();
  });

  document.addEventListener("click", e => {
    const goto = e.target.closest("[data-goto]");
    if (!goto) return;
    e.preventDefault();
    if (goto.dataset.reset === "1"){ resetFormState(); renderFormMode(true); }
    switchTab(goto.dataset.goto);
    if (goto.dataset.mode) setRecordMode(goto.dataset.mode);
  });

  let resizeTimer = null, lastMobile = isMobile();
  const onResize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const nowMobile = isMobile();
      if (nowMobile !== lastMobile){ lastMobile = nowMobile; renderMatches(); }
      const panel = document.getElementById("tab-analytics");
      if (panel && panel.classList.contains("active")) renderAnalytics();
    }, 180);
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  window.addEventListener("beforeunload", () => {
    saveDraftNow();
    saveLiveSession();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      saveDraftNow();
      saveLiveSession();
    }
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
(function init(){
  load();
  loadLiveSession();
  const savedDraft = loadDraftFromStorage();
  if (savedDraft && Array.isArray(savedDraft.sets) && savedDraft.sets.length){
    formState = {
      editingId: savedDraft.editingId || null,
      base: savedDraft.base || { date: todayISO(), opponent:"", location:"", tournament:"", notes:"" },
      sets: savedDraft.sets.map(normalizeSet).slice(0, MAX_SETS),
      activeSetIdx: Math.min(Math.max(0, savedDraft.activeSetIdx || 0), (savedDraft.sets.length || 1) - 1)
    };
  }
  bindEvents();
  renderAll();
  renderFormMode(true);
  setRecordMode("form");
  registerPWA();
  if (liveState.session){
    toast("Найдена незавершённая Live-сессия", "ok", {
      label: "Открыть",
      onClick: () => { switchTab("add"); setRecordMode("live"); }
    });
  }
})();
