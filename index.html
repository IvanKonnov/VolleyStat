<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="VolleyStat — статистика по сетам, live-режим, аналитика, цели, достижения.">
<title>🏐 VolleyStat</title>
<link rel="icon" id="faviconLink">
<link rel="apple-touch-icon" id="appleIconLink">
<style>
:root{
  --bg:#f4f6fb;--panel:#ffffff;--card:#ffffff;--card2:#f8fafc;
  --border:#d8dee9;--border-soft:rgba(216,222,233,.85);
  --text:#0b1220;--muted:#5a6b88;
  --orange:#ea580c;--orange-soft:#f97316;--blue:#2563eb;--green:#16a34a;
  --red:#dc2626;--yellow:#ca8a04;--purple:#9333ea;--cyan:#0891b2;
  --radius:14px;--radius-sm:10px;
  --shadow:0 12px 30px rgba(15,23,42,.10);
  --topbar-bg:rgba(244,246,251,.85);--live-glow:rgba(220,38,38,.25);
  --bottom-nav-h:65px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--panel:#111111;--card:#171717;--card2:#1e1e1e;
  --border:#2c2c2c;--border-soft:rgba(44,44,44,.8);
  --text:#e8e8e8;--muted:#8a8a8a;
  --orange:#f97316;--orange-soft:#fb923c;--blue:#3b82f6;--green:#22c55e;
  --red:#ef4444;--yellow:#eab308;--purple:#a855f7;--cyan:#06b6d4;
  --shadow:0 12px 30px rgba(0,0,0,.55);
  --topbar-bg:rgba(10,10,10,.85);--live-glow:rgba(239,68,68,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(249,115,22,.15)}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(219,234,254,.7) 0%, transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(254,215,170,.55) 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px;line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .3s ease,color .3s ease;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(50,38,28,.55) 0%, transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(40,32,24,.45) 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0 0 8px}
button{font:inherit;touch-action:manipulation}
input,select,textarea{touch-action:manipulation}
::selection{background:rgba(249,115,22,.35)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}

.topbar{position:sticky;top:0;z-index:50;background:var(--topbar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.app-header{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{font-size:28px;line-height:1;display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;flex:none;background:linear-gradient(135deg,rgba(249,115,22,.22),rgba(59,130,246,.18));border:1px solid rgba(249,115,22,.35);box-shadow:0 0 22px rgba(249,115,22,.18)}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}

.tabs{max-width:1280px;margin:0 auto;padding:0 20px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;transition:all .15s ease;scroll-snap-align:start;flex:none;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.tab .tab-ico{font-size:14px;line-height:1}
.tab:hover{color:var(--text);border-color:var(--orange)}
.tab.active{background:linear-gradient(135deg,var(--orange),var(--orange-soft));color:#fff;border-color:transparent;font-weight:700;box-shadow:0 6px 18px rgba(249,115,22,.28)}
.bottom-nav{display:none}
main{max-width:1280px;margin:0 auto;padding:24px 20px 90px}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)),var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-title{margin:0 0 16px;font-size:17px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;padding-left:10px;border-left:3px solid var(--orange);flex-wrap:wrap}
.section-head h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .2s ease,border-color .2s ease;min-width:0}
.kpi:hover{transform:translateY(-2px);border-color:var(--orange)}
.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--orange),var(--blue))}
.kpi.green::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.kpi.blue::before{background:linear-gradient(90deg,var(--blue),var(--purple))}
.kpi.red::before{background:linear-gradient(90deg,var(--red),var(--orange))}
.kpi .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .value{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .hint-line{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rating{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em}
.rating.bad{background:rgba(239,68,68,.14);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.rating.warn{background:rgba(234,179,8,.14);color:var(--yellow);border:1px solid rgba(234,179,8,.3)}
.rating.good{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.3)}

.backup-reminder{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(234,179,8,.35);background:linear-gradient(135deg,rgba(234,179,8,.08),rgba(249,115,22,.04));border-radius:12px;padding:12px 14px;margin-bottom:16px}
.backup-reminder .br-ico{font-size:22px;line-height:1;flex:none}
.backup-reminder .br-body{flex:1;min-width:0}
.backup-reminder .br-title{font-size:13.5px;font-weight:800;color:var(--yellow);margin-bottom:3px}
.backup-reminder .br-text{font-size:12.5px;color:var(--muted);line-height:1.45}
.backup-reminder .btn{flex:none;align-self:center}

.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head .emoji{font-size:20px;line-height:1}
.card-head h3{font-size:15.5px;font-weight:700}

.stat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border-soft);font-size:14px}
.stat-row:last-child{border-bottom:0}
.stat-row .k{color:var(--muted);min-width:0}
.stat-row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.stat-row .v.big{font-size:17px}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:rgba(34,197,94,.16);color:#16a34a;border:1px solid rgba(34,197,94,.4)}
.badge.warn{background:rgba(234,179,8,.16);color:#ca8a04;border:1px solid rgba(234,179,8,.4)}
.badge.bad{background:rgba(239,68,68,.16);color:#dc2626;border:1px solid rgba(239,68,68,.4)}
:root[data-theme="dark"] .badge.good{color:#4ade80}
:root[data-theme="dark"] .badge.warn{color:#facc15}
:root[data-theme="dark"] .badge.bad{color:#f87171}
.badge.win{background:rgba(34,197,94,.2);color:#16a34a;border:1px solid rgba(34,197,94,.45);font-weight:800}
.badge.loss{background:rgba(239,68,68,.2);color:#dc2626;border:1px solid rgba(239,68,68,.45);font-weight:800}
.badge.partial{background:rgba(59,130,246,.16);color:#2563eb;border:1px solid rgba(59,130,246,.4);font-weight:800}
:root[data-theme="dark"] .badge.win{color:#4ade80}
:root[data-theme="dark"] .badge.loss{color:#f87171}
:root[data-theme="dark"] .badge.partial{color:#93c5fd}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;cursor:pointer;transition:all .15s ease;white-space:nowrap;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--orange);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--orange),var(--orange-soft));color:#fff;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 10px 24px rgba(249,115,22,.32)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:var(--red)}
.btn.success{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:var(--green)}
.btn.icon{padding:5px 9px;font-size:14px;background:transparent;border-radius:8px;min-height:38px;min-width:38px}
.btn.icon.del:hover{background:rgba(239,68,68,.16)}
.btn.toggle{padding:6px 12px;font-size:13px;min-height:34px;border-radius:999px}
.btn.toggle.active{background:linear-gradient(135deg,var(--orange),var(--orange-soft));color:#fff;border-color:transparent;font-weight:700}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;min-width:0}
.field{display:flex;flex-direction:column;min-width:0;position:relative}
.field label{font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;max-width:100%;min-width:0;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;font-size:14px;transition:border-color .15s ease,box-shadow .15s ease;min-height:42px;display:block}
input[type="date"]{color-scheme:light;-webkit-appearance:none;appearance:none;min-width:0;width:100%}
:root[data-theme="dark"] input[type="date"]{color-scheme:dark}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
input.invalid,select.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.12)}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.section-title{margin:22px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.row-inline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row-inline input{flex:1;min-width:0}

.set-selector{background:linear-gradient(180deg,rgba(249,115,22,.06),rgba(59,130,246,.04));border:1px solid var(--border);border-radius:12px;padding:12px;margin:6px 0 14px}
.set-selector-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.set-selector-head .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.set-selector-head .count{font-size:12px;color:var(--yellow);font-weight:700;background:rgba(234,179,8,.14);border:1px solid rgba(234,179,8,.3);padding:3px 10px;border-radius:999px}
.set-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s ease;min-height:40px;min-width:64px;font-variant-numeric:tabular-nums;position:relative}
.set-chip:hover{border-color:var(--orange)}
.set-chip.active{background:linear-gradient(135deg,var(--orange),var(--orange-soft));color:#fff;border-color:transparent;font-weight:800;box-shadow:0 6px 16px rgba(249,115,22,.28)}
.set-chip .pts{font-size:11px;font-weight:700;color:var(--muted);background:rgba(216,222,233,.85);padding:1px 6px;border-radius:999px;margin-left:2px}
:root[data-theme="dark"] .set-chip .pts{background:rgba(35,50,84,.7)}
.set-chip.active .pts{color:#fff;background:rgba(255,255,255,.25)}
.set-chip.add{background:transparent;border-style:dashed;color:var(--muted);font-weight:700}
.set-chip.del{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35);color:var(--red);font-weight:700;min-width:40px}
.set-chip.dup{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:var(--blue);font-weight:600}

.set-fields{background:var(--card2);border:1px dashed var(--border);border-radius:12px;padding:14px;margin-bottom:6px}
.set-fields-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:12px;color:var(--orange)}
.set-fields-title .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px rgba(249,115,22,.8)}

.preview{display:grid;grid-template-columns:1fr;gap:14px;background:var(--card2);border:1px dashed var(--border);border-radius:12px;padding:16px;margin-top:18px}
.preview-block{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel)}
.preview-block.total{background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(59,130,246,.06));border-color:rgba(249,115,22,.25)}
.preview-block h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preview-block h4 .tag{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:800;text-transform:none;letter-spacing:0}
.preview-block.total h4 .tag{background:rgba(249,115,22,.2);color:var(--orange);border:1px solid rgba(249,115,22,.35)}
.preview-block.current h4 .tag{background:rgba(59,130,246,.2);color:var(--blue);border:1px solid rgba(59,130,246,.35)}
.pv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pv{display:flex;flex-direction:column;gap:2px;min-width:0}
.pv .pv-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pv-value{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.pv-value.good{color:var(--green)}
.pv-value.warn{color:var(--yellow)}
.pv-value.bad{color:var(--red)}

.live-mode{border:2px solid var(--red);border-radius:16px;padding:16px;background:linear-gradient(180deg,rgba(239,68,68,.04),rgba(239,68,68,.01));box-shadow:0 0 0 4px rgba(239,68,68,.06),inset 0 0 30px rgba(239,68,68,.04)}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:999px;box-shadow:0 0 20px var(--live-glow);letter-spacing:.05em}
.live-badge .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.live-scoreboard{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 0 6px;flex-wrap:nowrap}
.live-scoreboard .lsc{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1 1 0;max-width:120px}
.live-scoreboard .lsc .lsc-v{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.live-scoreboard .lsc .lsc-l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.08em}
.live-scoreboard .sep{font-size:28px;color:var(--muted);font-weight:300;flex:none}
.live-scoreboard .lsc.us .lsc-v{color:var(--green)}
.live-scoreboard .lsc.them .lsc-v{color:var(--red)}
.live-hint{text-align:center;font-size:11.5px;color:var(--muted);margin:0 0 6px;padding:0 8px;line-height:1.4}
.live-btn-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.live-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 6px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:700;transition:all .12s ease;min-height:84px;user-select:none;min-width:0}
.live-btn:active{transform:scale(.96)}
.live-btn .lb-ico{font-size:24px;line-height:1}
.live-btn .lb-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.live-btn.good{border-color:rgba(34,197,94,.4);background:linear-gradient(180deg,rgba(34,197,94,.1),rgba(34,197,94,.03))}
.live-btn.bad{border-color:rgba(239,68,68,.4);background:linear-gradient(180deg,rgba(239,68,68,.1),rgba(239,68,68,.03))}
.live-btn.neutral{border-color:rgba(59,130,246,.4);background:linear-gradient(180deg,rgba(59,130,246,.08),rgba(59,130,246,.02))}
.live-section-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:16px 0 4px}
.live-history{max-height:140px;overflow-y:auto;margin-top:14px;border-top:1px dashed var(--border);padding-top:10px}
.live-history .lh-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--border-soft)}
.live-history .lh-item:last-child{border-bottom:0}
.live-history .lh-t{color:var(--muted);flex:none}
.live-history .lh-a{font-weight:700;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.live-history .lh-a.good{color:var(--green)}
.live-history .lh-a.bad{color:var(--red)}
.live-bottom-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--border)}

.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1180px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border-soft)}
th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;background:var(--panel);position:sticky;top:0;z-index:2;backdrop-filter:blur(6px)}
tbody tr{transition:background .15s ease;cursor:pointer}
tbody tr:hover{background:rgba(59,130,246,.07)}
tbody tr:last-child td{border-bottom:0}
td.actions{text-align:right}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.matches-cards{display:flex;flex-direction:column;gap:12px}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;animation:fadeUp .25s ease both;transition:border-color .15s ease;position:relative}
.match-card:hover{border-color:var(--orange)}
.match-card.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.match-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.match-card .cb{width:26px;height:26px;flex:none;border:2px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;display:grid;place-items:center;align-self:flex-start;margin-top:2px;transition:border-color .15s ease}
.match-card .cb:hover{border-color:var(--blue)}
.match-card .cb input{display:none}
.match-card .cb.checked{background:var(--blue);border-color:var(--blue)}
.match-card .cb.checked::after{content:"✓";color:#fff;font-weight:900;font-size:14px;line-height:1}
.match-date{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.match-opponent{font-size:16px;font-weight:800;line-height:1.25;margin-top:2px;word-break:break-word}
.match-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.match-meta span{background:var(--card2);padding:2px 9px;border-radius:999px;border:1px solid var(--border)}
.match-meta .meta-points{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(59,130,246,.14));border-color:rgba(249,115,22,.35);color:var(--orange);font-weight:800}
.match-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;padding:10px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);margin-bottom:10px}
.match-stats .ms-item{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.match-stats .ms-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;flex:none}
.match-stats .ms-v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-actions{display:grid;grid-template-columns:1fr auto auto auto;gap:6px}
.match-actions .btn{min-height:44px;font-size:13.5px;padding:8px 10px}
.match-actions .btn.details{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);font-weight:700}
.match-actions .btn.icon{min-width:44px;min-height:44px;font-size:16px}

.compare-bar{position:sticky;bottom:12px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(59,130,246,.4);margin-top:14px;animation:fadeUp .25s ease both;flex-wrap:wrap}
.compare-bar .cb-lbl{font-weight:800;font-size:14px}
.compare-bar .btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
.compare-bar .btn:hover{background:rgba(255,255,255,.3)}

.compare-table{width:100%;border-collapse:collapse;font-size:13.5px}
.compare-table th,.compare-table td{padding:9px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
.compare-table th{font-size:11.5px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.05em;background:var(--panel);position:sticky;top:0}
.compare-table .metric-l{font-weight:700}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(2,6,14,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fadeIn .2s ease both}
.modal-overlay[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:modalIn .25s cubic-bezier(.2,.8,.3,1) both;overflow:hidden}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(59,130,246,.05));flex-shrink:0}
.modal-header .mh-left{min-width:0;flex:1}
.modal-date{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.modal-opponent{font-size:20px;font-weight:800;line-height:1.2;margin:2px 0 6px;word-break:break-word}
.modal-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.modal-meta span{background:var(--card2);padding:2px 9px;border-radius:999px;border:1px solid var(--border)}
.modal-close{background:transparent;border:1px solid var(--border);color:var(--muted);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px;line-height:1;flex:none;transition:all .15s ease}
.modal-close:hover{color:var(--red);border-color:var(--red);background:rgba(239,68,68,.08)}
.modal-body{padding:18px 20px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--panel);flex-shrink:0}

.mkpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mkpi-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0}
.mkpi-item .mk-l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkpi-item .mk-v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.set-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.set-summary{border:1px solid var(--border);border-radius:12px;background:var(--card2);padding:14px;position:relative;overflow:hidden}
.set-summary.best{border-color:rgba(34,197,94,.5)}
.set-summary.worst{border-color:rgba(239,68,68,.4)}
.set-summary-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.set-summary-head .set-name{font-size:15px;font-weight:800;color:var(--orange);letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;flex:0 1 auto;min-width:0}
.set-summary-head .set-summary-score{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.set-summary-head .set-summary-score.win{color:var(--green)}
.set-summary-head .set-summary-score.loss{color:var(--red)}
.set-summary-head .set-summary-score.draw{color:var(--muted)}
.set-summary-head .set-summary-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:999px;flex:none;text-transform:none}
.set-summary-head .set-summary-badge.best{color:var(--green);background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35)}
.set-summary-head .set-summary-badge.worst{color:var(--red);background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35)}
.set-summary-head .set-points{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,rgba(249,115,22,.16),rgba(59,130,246,.12));border:1px solid rgba(249,115,22,.3);border-radius:999px;padding:3px 11px;color:var(--orange);margin-left:auto;flex:none}
.set-summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.set-summary-stats .ss{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.set-summary-stats .ss-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;flex:none}
.set-summary-stats .ss-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-bars{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.set-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.set-bar-row .sb-label{width:50px;flex:none;color:var(--muted);font-weight:700}
.set-bar-track{flex:1;height:20px;border-radius:6px;background:rgba(216,222,233,.6);overflow:hidden;position:relative;min-width:0}
:root[data-theme="dark"] .set-bar-track{background:rgba(35,50,84,.5)}
.set-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--orange),var(--orange-soft));transition:width .5s cubic-bezier(.2,.8,.3,1);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-weight:800;font-size:11px;min-width:24px}
.set-bar-row .sb-val{width:36px;flex:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

.achievements-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ach-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:all .2s ease;position:relative;overflow:hidden}
.ach-card.locked{opacity:.5;filter:saturate(.3)}
.ach-card:not(.locked){border-color:rgba(34,197,94,.35);background:linear-gradient(180deg,rgba(34,197,94,.07),var(--card2))}
.ach-card .ach-ico{font-size:32px;line-height:1}
.ach-card .ach-name{font-size:12.5px;font-weight:800;line-height:1.25}
.ach-card .ach-desc{font-size:10.5px;color:var(--muted);line-height:1.3}

.streaks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.streak-card{background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(239,68,68,.06));border:1px solid rgba(249,115,22,.25);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.streak-card .sk-ico{font-size:28px;line-height:1;flex:none}
.streak-card .sk-num{font-size:22px;font-weight:900;color:var(--orange);font-variant-numeric:tabular-nums;line-height:1}
.streak-card .sk-lbl{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}

.goal-row{margin-bottom:14px}
.goal-row:last-child{margin-bottom:0}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;font-size:13.5px;flex-wrap:wrap}
.goal-head .gh-l{font-weight:700}
.goal-head .gh-v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:12.5px}
.goal-track{height:10px;background:rgba(216,222,233,.7);border-radius:999px;overflow:hidden;position:relative}
:root[data-theme="dark"] .goal-track{background:rgba(35,50,84,.55)}
.goal-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--orange),var(--green));transition:width .5s cubic-bezier(.2,.8,.3,1);min-width:0}
.goal-fill.met{background:linear-gradient(90deg,var(--green),var(--cyan))}

.records-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.record-card{background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(59,130,246,.05));border:1px solid rgba(168,85,247,.28);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.record-card .rc-ico{font-size:24px;line-height:1;flex:none}
.record-card .rc-body{min-width:0;flex:1}
.record-card .rc-l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.record-card .rc-v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--purple);line-height:1.1;margin-top:2px}
.record-card .rc-h{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.trend-card{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;gap:10px}
.trend-card .tc-l{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.trend-card .tc-v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.trend-card .tc-v.up{color:var(--green)}
.trend-card .tc-v.down{color:var(--red)}
.trend-card .tc-v.flat{color:var(--muted)}
.trend-card .tc-d{font-size:11px;color:var(--muted);font-weight:600}

.thresholds-table{width:100%;border-collapse:collapse;margin-top:4px}
.thresholds-table th{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.04em;padding:6px 10px;text-align:left}
.thresholds-table td{padding:6px 10px;border-top:1px solid var(--border-soft);font-size:14px}
.thresholds-table td:first-child{font-weight:600;white-space:nowrap;color:var(--muted)}
.thresholds-table input{width:100%;min-width:70px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);font-size:13px}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px;border-radius:50%;transition:color .15s ease,background .15s ease;min-width:24px;min-height:24px}
.chip button:hover{color:var(--red);background:rgba(239,68,68,.15)}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 6px;position:relative}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:2px;padding-right:90px}
.chart-card .hint{color:var(--muted);font-size:12.5px;margin:0 0 8px;padding-right:90px}
.chart{width:100%;min-height:120px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart-skeleton{min-height:180px;display:grid;place-items:center;color:var(--muted);font-size:12.5px;font-weight:600;border:1px dashed var(--border);border-radius:10px}
.chart-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.chart-actions .btn{min-height:36px;padding:6px 10px;font-size:12px;border-radius:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.empty{text-align:center;padding:56px 22px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);background:rgba(248,250,252,.6)}
:root[data-theme="dark"] .empty{background:rgba(22,32,58,.4)}
.empty .icon{font-size:52px;display:block;margin-bottom:14px;line-height:1;filter:saturate(.9)}
.empty h3{color:var(--text);font-size:18px;margin-bottom:6px}
.empty p{margin-bottom:18px}

.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:min(360px,calc(100vw - 40px));pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--orange);padding:12px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:14px;animation:toastIn .25s ease both;word-break:break-word;pointer-events:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
.toast .t-act{background:transparent;border:1px solid var(--border);color:var(--orange);font-weight:800;padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer;flex:none}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;user-select:none}
.switch input{display:none}
.switch .sw-track{width:42px;height:24px;border-radius:999px;background:rgba(216,222,233,.85);position:relative;transition:background .2s ease;flex:none}
:root[data-theme="dark"] .switch .sw-track{background:rgba(35,50,84,.7)}
.switch .sw-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch input:checked + .sw-track{background:var(--orange)}
.switch input:checked + .sw-track::after{transform:translateX(18px)}

.help-toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card2)}
.help-toc a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;transition:all .15s ease;cursor:pointer}
.help-toc a:hover{border-color:var(--orange);color:var(--orange)}
.help-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px;scroll-margin-top:140px}
.help-section h2{font-size:18px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--text);padding-bottom:10px;border-bottom:1px solid var(--border)}
.help-section h2 .hn{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange-soft));color:#fff;font-size:14px;font-weight:900}
.help-section h3{font-size:14.5px;font-weight:800;margin:16px 0 6px;color:var(--text)}
.help-section h4{font-size:13.5px;font-weight:800;margin:14px 0 6px;color:var(--orange)}
.help-section p{margin:0 0 10px;line-height:1.65}
.help-section ul,.help-section ol{margin:0 0 12px;padding-left:22px;line-height:1.7}
.help-section li{margin-bottom:5px}
.help-section li:last-child{margin-bottom:0}
.help-section code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;padding:1px 6px;border-radius:5px;background:rgba(59,130,246,.14);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.help-section strong{color:var(--text);font-weight:700}
.help-section em{color:var(--muted);font-style:normal;font-weight:600}
.help-warning{border:1px solid rgba(239,68,68,.4);background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(249,115,22,.05));border-radius:12px;padding:14px 16px;margin:12px 0;display:flex;gap:12px;align-items:flex-start}
.help-warning .hw-ico{font-size:24px;line-height:1;flex:none}
.help-warning .hw-body{min-width:0}
.help-warning .hw-body strong{color:var(--red);display:block;margin-bottom:4px;font-size:14px}
.help-tip{border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.06);border-radius:10px;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.help-tip .ht-ico{font-size:18px;line-height:1.2;flex:none}
.help-example{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;color:var(--muted)}
.help-example strong{color:var(--text)}
.help-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.help-grid-2 .hg-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55}
.help-grid-2 .hg-item b{display:block;margin-bottom:4px;color:var(--orange)}
.kbd{display:inline-block;padding:1px 8px;border-radius:6px;border:1px solid var(--border);border-bottom-width:2px;background:var(--panel);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--text);font-weight:700}
.norms-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 16px}
.norms-table th,.norms-table td{padding:7px 10px;border-bottom:1px solid var(--border-soft);text-align:left;white-space:nowrap}
.norms-table th{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.04em;background:var(--panel)}
.norms-table td:first-child{color:var(--text);font-weight:700}
.norms-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.norms-legend .nl-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.norms-legend .nl-item.bad{background:rgba(239,68,68,.14);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.norms-legend .nl-item.low{background:rgba(234,179,8,.14);color:var(--yellow);border:1px solid rgba(234,179,8,.3)}
.norms-legend .nl-item.avg{background:rgba(234,179,8,.10);color:var(--yellow);border:1px solid rgba(234,179,8,.25)}
.norms-legend .nl-item.good{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.norms-legend .nl-item.excellent{background:rgba(34,197,94,.2);color:var(--green);border:1px solid rgba(34,197,94,.45)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:2px solid var(--bg)}

function isMobile(){ return window.innerWidth < MOBILE_BREAKPOINT; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayISO(){
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function safeDiv(a, b){ return (b && b > 0) ? a/b : 0; }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}
function num(v){
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
}
function intOrNull(v){
  if (v === "" || v == null) return null;
  const n = Math.floor(Number(v));
  if (!Number.isFinite(n) || n < 0) return null;
  return Math.min(n, MAX_SCORE);
}
function safeRatio(v){
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(0, Math.min(1, n)) : 0;
}
function pct(v){ return (v*100).toFixed(1) + "%"; }
function pct0(v){ return Math.round(v*100) + "%"; }
function cssVar(name){
  try {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#0a0a0a";
  } catch(e){ return "#0a0a0a"; }
}

function isoToLocalDate(iso){
  if (!iso || iso.length < 10) return null;
  const y = Number(iso.slice(0,4));
  const m = Number(iso.slice(5,7));
  const d = Number(iso.slice(8,10));
  if (!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d)) return null;
  return new Date(y, m - 1, d);
}
function daysBetween(iso1, iso2){
  try {
    const d1 = isoToLocalDate(iso1);
    const d2 = isoToLocalDate(iso2);
    if (!d1 || !d2) return 0;
    return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
  } catch(e){ return 0; }
}

function fmtDateRu(iso){
  if (!iso || iso.length < 10) return "—";
  return iso.slice(8,10) + "." + iso.slice(5,7) + "." + iso.slice(0,4);
}
function fmtDateShort(iso){
  if (!iso || iso.length < 10) return "—";
  return iso.slice(8,10) + "." + iso.slice(5,7);
}
function pluralSets(n){
  if (n === 0) return "0 сетов";
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return n + " сет";
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return n + " сета";
  return n + " сетов";
}
function pluralMatches(n){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return n + " матч";
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return n + " матча";
  return n + " матчей";
}

function toast(message, type, action){
  const host = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (type === "ok" ? " ok" : type === "err" ? " err" : "");
  const span = document.createElement("span");
  span.textContent = message;
  el.appendChild(span);
  if (action && action.label && typeof action.onClick === "function"){
    const btn = document.createElement("button");
    btn.className = "t-act";
    btn.type = "button";
    btn.textContent = action.label;
    btn.addEventListener("click", () => { action.onClick(); cleanup(); });
    el.appendChild(btn);
  }
  host.appendChild(el);
  let ttl = action ? 5000 : 3000;
  let timer = null;
  const cleanup = () => {
    clearTimeout(timer);
    el.style.transition = "opacity .3s ease, transform .3s ease";
    el.style.opacity = "0";
    el.style.transform = "translateX(24px)";
    setTimeout(() => el.remove(), 320);
  };
  const start = () => { timer = setTimeout(cleanup, ttl); };
  el.addEventListener("mouseenter", () => clearTimeout(timer));
  el.addEventListener("mouseleave", start);
  el.addEventListener("touchstart", () => clearTimeout(timer), { passive: true });
  el.addEventListener("touchend", start, { passive: true });
  start();
}

   UNDO
   ============================================================ */
function pushUndo(label){
  undoStack.push({
    state: JSON.stringify(state),
    compareSelection: [...compareSelection],
    label: label || "Действие"
  });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function undo(){
  if (undoing) return;
  if (!undoStack.length){ toast("Нечего отменять", "err"); return; }
  undoing = true;
  try {
    const last = undoStack.pop();
    state = normalizeState(JSON.parse(last.state));
    if (Array.isArray(last.compareSelection)){
      compareSelection = new Set(last.compareSelection.filter(id => state.matches.some(m => m.id === id)));
    } else {
      [...compareSelection].forEach(id => { if (!state.matches.some(m => m.id === id)) compareSelection.delete(id); });
    }
    applyTheme(state.settings.theme);
    save();
    if (formState.editingId && !state.matches.some(m => m.id === formState.editingId)){
      resetFormState();
      renderFormMode(true);
    }
    renderAll();
    toast("Отменено: " + last.label, "ok");
  } catch (e){
    toast("Не удалось отменить", "err");
  } finally {
    undoing = false;
  }
}

/* ============================================================
   НОРМАЛИЗАЦИЯ И МИГРАЦИЯ
   ============================================================ */
function migrateRawMatch(m, fromVersion){
  if (!m || typeof m !== "object") return m;
  if (fromVersion >= 6) return m;
  const copy = JSON.parse(JSON.stringify(m));
  const eachRec = fn => {
    if (Array.isArray(copy.sets_data)) copy.sets_data.forEach(s => { if (s && s.reception) fn(s.reception); });
    if (copy.reception) fn(copy.reception);
  };
  if (fromVersion === 4){
    eachRec(r => { r.positive = Math.max(0, num(r.positive) - num(r.excellent)); });
  }
  eachRec(r => {
    r.neutral = Math.max(0, num(r.total) - num(r.positive) - num(r.excellent) - num(r.errors));
  });
  return copy;
}

function normalizeSet(s){
  s = s || {};
  const a = s.attack || {}, sv = s.serve || {}, r = s.reception || {}, b = s.block || {};
  return {
    score_us:   intOrNull(s.score_us),
    score_them: intOrNull(s.score_them),
    attack:    { total:num(a.total), errors:num(a.errors), blocked:num(a.blocked), kills:num(a.kills) },
    serve:     { total:num(sv.total), errors:num(sv.errors), aces:num(sv.aces) },
    reception: { total:num(r.total), errors:num(r.errors), positive:num(r.positive), excellent:num(r.excellent), neutral:num(r.neutral) },
    block:     { kills:num(b.kills) }
  };
}
function finalizeMatch(m){
  const agg = aggregateSets(m.sets_data || []);
  m.attack = agg.attack;
  m.serve = agg.serve;
  m.reception = agg.reception;
  m.block = agg.block;
  return m;
}
function normalizeMatch(m){
  m = m || {};
  let sets_data;
  if (Array.isArray(m.sets_data) && m.sets_data.length){
    sets_data = m.sets_data.map(normalizeSet);
  } else if (m.attack && (m.attack.total !== undefined || m.serve)){
    sets_data = [normalizeSet({
      attack:m.attack, serve:m.serve, reception:m.reception, block:m.block,
      score_us:m.score_us, score_them:m.score_them
    })];
  } else {
    sets_data = [emptySet()];
  }
  const out = {
    id: String(m.id || uid()),
    date: /^\d{4}-\d{2}-\d{2}$/.test(m.date) ? m.date : todayISO(),
    opponent: String(m.opponent || ""),
    location: String(m.location || ""),
    tournament: String(m.tournament || ""),
    sets_data: sets_data,
    notes: String(m.notes || "")
  };
  return finalizeMatch(out);
}
function normalizeState(data){
  const s = createDefaultState();
  if (data && typeof data === "object"){
    const fromVersion = Number(data.schemaVersion) || 1;
    if (Array.isArray(data.matches)){
      s.matches = data.matches.map(raw => {
        const migrated = migrateRawMatch(raw, fromVersion);
        return normalizeMatch(migrated);
      });
      const seen = new Set();
      s.matches.forEach(m => {
        while (seen.has(m.id)) m.id = uid();
        seen.add(m.id);
      });
    }
    if (data.directories && typeof data.directories === "object"){
      ["opponents","locations","tournaments"].forEach(k => {
        if (Array.isArray(data.directories[k])){
          const uniq = [];
          const seen = new Set();
          data.directories[k].forEach(v => {
            const val = String(v);
            if (val && !seen.has(val)){ seen.add(val); uniq.push(val); }
          });
          s.directories[k] = uniq;
        }
      });
    }
    if (data.profile && typeof data.profile === "object"){
      s.profile = {
        player: String(data.profile.player || ""),
        team: String(data.profile.team || ""),
        position: String(data.profile.position || "Доигровщик")
      };
    }
    if (data.settings && typeof data.settings === "object"){
      const st = data.settings;
      if (st.theme === "light" || st.theme === "dark") s.settings.theme = st.theme;
      if (st.thresholds && typeof st.thresholds === "object"){
        ["attEff","posPct","acePct"].forEach(k => {
          const t = st.thresholds[k];
          if (t && typeof t === "object"){
            const good = Number(t.good), bad = Number(t.bad);
            if (Number.isFinite(good) && Number.isFinite(bad) && good > bad && bad >= 0 && good <= 1 && bad <= 1){
              s.settings.thresholds[k] = { good, bad };
            }
          }
        });
      }
      if (st.goals && typeof st.goals === "object"){
        const g = st.goals;
        const pickRatio = (key) => {
          const v = Number(g[key]);
          if (Number.isFinite(v) && v >= 0 && v <= 1) s.settings.goals[key] = v;
        };
        const pickCount = (key) => {
          const v = Number(g[key]);
          if (Number.isFinite(v) && v >= 0 && v <= 100000) s.settings.goals[key] = Math.floor(v);
        };
        pickRatio("attEff");
        pickCount("seasonAces");
        pickCount("seasonPoints");
        pickCount("matchesWithPos50");
      }
      if (st.pirWeights && typeof st.pirWeights === "object"){
        const we = Number(st.pirWeights.excellent);
        const wp = Number(st.pirWeights.positiveRegular);
        if (Number.isFinite(we) && we >= 0 && we <= 10) s.settings.pirWeights.excellent = we;
        if (Number.isFinite(wp) && wp >= 0 && wp <= 10) s.settings.pirWeights.positiveRegular = wp;
      }
      const tm = Number(st.trendMin);
      if (Number.isFinite(tm) && tm >= 2 && tm <= 30) s.settings.trendMin = Math.floor(tm);
      if (typeof st.lastExportAt === "string" && /^\d{4}-\d{2}-\d{2}/.test(st.lastExportAt)){
        s.settings.lastExportAt = st.lastExportAt;
      }
    }
  }
  s.schemaVersion = SCHEMA_VERSION;
  return s;
}

function load(){
  try {

      } catch (parseErr){
        const bk = localStorage.getItem(BACKUP_KEY);
        if (bk){
          try {
            state = normalizeState(JSON.parse(bk));
            toast("Основные данные повреждены, восстановлен бэкап", "err");
          } catch (_){
            toast("Данные повреждены, начинаем с чистого листа", "err");
          }
        } else {
          toast("Данные повреждены", "err");
        }
      }
    }

/* ============================================================
   ФОРМУЛЫ
   ============================================================ */
function metrics(o){
  const a = o.attack || {}, s = o.serve || {}, r = o.reception || {}, b = o.block || {};
  const attTotal = num(a.total);
  const kills = num(a.kills);
  const errs = num(a.errors);
  const blocked = num(a.blocked);
  const srvTotal = num(s.total);
  const srvAces = num(s.aces);
  const srvErrs = num(s.errors);
  const recPositive = num(r.positive);
  const recExcellent = num(r.excellent);
  const recNeutral = num(r.neutral);
  const recTotal = num(r.total);
  return {
    attEff:  safeDiv(kills - errs - blocked, attTotal),
    killPct: safeDiv(kills, attTotal),
    acePct:  safeDiv(srvAces, srvTotal),
    srvEff:  safeDiv(srvAces - srvErrs, srvTotal),
    srvErrPct: safeDiv(srvErrs, srvTotal),
    posPct:  safeDiv(recPositive, recTotal),
    excPct:  safeDiv(recExcellent, recTotal),
    neutralPct: safeDiv(recNeutral, recTotal),
    goodPct: safeDiv(recPositive + recExcellent, recTotal),
    points:  kills + srvAces + num(b.kills)
  };
}

function aggregateSets(sets){
  const t = {
    attack:    { total:0, errors:0, blocked:0, kills:0 },
    serve:     { total:0, errors:0, aces:0 },
    reception: { total:0, errors:0, positive:0, excellent:0, neutral:0 },
    block:     { kills:0 }
  };
  (sets || []).forEach(s => {
    s = s || {};
    const a = s.attack||{}, sv = s.serve||{}, r = s.reception||{}, b = s.block||{};
    t.attack.total    += num(a.total);
    t.attack.errors   += num(a.errors);
    t.attack.blocked  += num(a.blocked);
    t.attack.kills    += num(a.kills);
    t.serve.total     += num(sv.total);
    t.serve.errors    += num(sv.errors);
    t.serve.aces      += num(sv.aces);
    t.reception.total     += num(r.total);
    t.reception.errors    += num(r.errors);
    t.reception.positive  += num(r.positive);
    t.reception.excellent += num(r.excellent);
    t.reception.neutral   += num(r.neutral);
    t.block.kills     += num(b.kills);
  });
  return t;
}

function computeMatch(m){
  const fallback = aggregateSets(m.sets_data || []);
  const agg = {
    attack:    m.attack    || fallback.attack,
    serve:     m.serve     || fallback.serve,
    reception: m.reception || fallback.reception,
    block:     m.block     || fallback.block
  };
  const result = Object.assign({}, m, metrics(agg));
  result.setsCount  = (m.sets_data || []).length;
  result.playedSets = playedSetsCount(m);
  result.statsSets  = statsSetsCount(m);
  result.setMetrics = (m.sets_data || []).map((s, i) => Object.assign({ idx: i+1, raw: s }, metrics(s)));
  result.result = matchResult(m);
  result.pir = matchNetPoints(m);
  const denom = result.statsSets || 0;
  result.pointsPerSet = denom > 0 ? result.points / denom : 0;
  result.blockPerSet  = denom > 0 ? num(m.block.kills) / denom : 0;
  result.attPerSet    = denom > 0 ? num(m.attack.total) / denom : 0;
  return result;
}

function matchNetPoints(m){
  const sets = m.sets_data || [];
  const denom = statsSetsCount(m);
  if (!denom) return 0;
  const w = (state.settings && state.settings.pirWeights)
    ? state.settings.pirWeights
    : DEFAULT_PIR_WEIGHTS;
  let total = 0;
  sets.forEach(s => {
    const a = s.attack||{}, sv = s.serve||{}, r = s.reception||{}, b = s.block||{};
    total += num(a.kills) + num(sv.aces) + num(b.kills)
           + w.excellent * num(r.excellent)
           + w.positiveRegular * num(r.positive)
           - num(a.errors) - num(sv.errors) - num(r.errors) - num(a.blocked);
  });
  return total / denom;
}

function scoreUs(s){ return s ? intOrNull(s.score_us) : null; }
function scoreThem(s){ return s ? intOrNull(s.score_them) : null; }

function matchResult(m){
  const sets = m.sets_data || [];
  let us = 0, them = 0, scored = 0;
  sets.forEach(s => {
    const a = scoreUs(s), b = scoreThem(s);
    if (a == null || b == null) return;
    scored++;
    if (a > b) us++; else if (b > a) them++;
  });
  const played = playedSetsCount(m);
  if (scored === 0){
    return { valid:false, partial:false, draw:false, us:0, them:0, win:false, label:"—", scored:0, played, total:sets.length, shortMatch:false };
  }
  const complete = scored >= played;
  const draw = us === them;
  const win = us > them;
  const shortMatch = played > 0 && played < 3;
  return { valid:true, partial:!complete, draw, us, them, win, label: us + ":" + them, scored, played, total:sets.length, shortMatch };
}

function computeSeason(matches){
  const t = {
    count: matches.length,
    setsRecorded: 0,
    playedSets: 0,
    statsSets: 0,
    wins:0, losses:0, draws:0,
    setsWon:0, setsLost:0,
    matchesWithScore:0,
    matchesPartialCount: 0,
    matchesDrawCount: 0,
    realMatches: 0
  };
  const flat = {
    attack:{total:0,errors:0,blocked:0,kills:0},
    serve:{total:0,errors:0,aces:0},
    reception:{total:0,errors:0,positive:0,excellent:0,neutral:0},
    block:{kills:0}
  };
  let totalPIR = 0;
  let totalStatsForPIR = 0;

  matches.forEach(m => {
    const setsHere = (m.sets_data || []).length;
    const played  = playedSetsCount(m);
    const stats   = statsSetsCount(m);
    t.setsRecorded += setsHere;
    t.playedSets   += played;
    t.statsSets    += stats;

    (m.sets_data || []).forEach(s => {
      const a = s.attack||{}, sv = s.serve||{}, r = s.reception||{}, b = s.block||{};
      flat.attack.total    += num(a.total);
      flat.attack.errors   += num(a.errors);
      flat.attack.blocked  += num(a.blocked);
      flat.attack.kills    += num(a.kills);
      flat.serve.total     += num(sv.total);
      flat.serve.errors    += num(sv.errors);
      flat.serve.aces      += num(sv.aces);
      flat.reception.total     += num(r.total);
      flat.reception.errors    += num(r.errors);
      flat.reception.positive  += num(r.positive);
      flat.reception.excellent += num(r.excellent);
      flat.reception.neutral   += num(r.neutral);
      flat.block.kills     += num(b.kills);
    });

    const r = matchResult(m);
    if (r.valid){
      t.setsWon += r.us;
      t.setsLost += r.them;
      if (r.partial){
        t.matchesPartialCount += 1;
      } else if (r.draw){
        t.matchesDrawCount += 1;
      } else {
        t.matchesWithScore += 1;
        if (r.win) t.wins += 1; else t.losses += 1;
      }
    }

    if (hasRealData(m)) t.realMatches += 1;

    const pirPerSet = matchNetPoints(m);
    totalPIR += pirPerSet * stats;
    totalStatsForPIR += stats;
  });

  const out = Object.assign(t, flat, metrics(flat));
  out.pirAvg = totalStatsForPIR > 0 ? totalPIR / totalStatsForPIR : 0;
  out.winPct = t.matchesWithScore ? t.wins / t.matchesWithScore : 0;
  out.pointsPerSet = t.statsSets > 0 ? out.points / t.statsSets : 0;
  out.blockPerSet  = t.statsSets > 0 ? num(out.block.kills) / t.statsSets : 0;
  out.attPerSet    = t.statsSets > 0 ? num(out.attack.total) / t.statsSets : 0;
  return out;
}

function computeSetNumberStats(matches){
  const byNum = {};
  matches.forEach(m => {
    (m.sets_data || []).forEach((s, i) => {
      if (!hasStatsSet(s)) return;
      const n = i + 1;
      if (!byNum[n]){
        byNum[n] = {
          attack:{total:0,errors:0,blocked:0,kills:0},
          serve:{total:0,errors:0,aces:0},
          reception:{total:0,errors:0,positive:0,excellent:0,neutral:0},
          block:{kills:0},
          count:0
        };
      }
      const g = byNum[n];
      const a = s.attack||{}, sv = s.serve||{}, r = s.reception||{}, b = s.block||{};
      g.attack.total    += num(a.total);
      g.attack.errors   += num(a.errors);
      g.attack.blocked  += num(a.blocked);
      g.attack.kills    += num(a.kills);
      g.serve.total     += num(sv.total);
      g.serve.errors    += num(sv.errors);
      g.serve.aces      += num(sv.aces);
      g.reception.total     += num(r.total);
      g.reception.errors    += num(r.errors);
      g.reception.positive  += num(r.positive);
      g.reception.excellent += num(r.excellent);
      g.reception.neutral   += num(r.neutral);
      g.block.kills     += num(b.kills);
      g.count++;
    });
  });

  const out = [];
  for (let n = 1; n <= MAX_SETS; n++){
    const g = byNum[n];
    if (!g || !g.count) continue;
    const m = metrics(g);
    out.push({
      number: n, label: "Сет " + n, count: g.count,
      attEff: m.attEff, posPct: m.posPct, goodPct: m.goodPct, excPct: m.excPct, acePct: m.acePct,
      points: m.points / g.count
    });
  }
  return out;
}

function computeGroupedBy(matches, key){
  const groups = {};
  matches.forEach(m => {
    const k = (m[key] || "").trim() || "—";
    if (!groups[k]) groups[k] = [];
    groups[k].push(m);
  });
  const out = [];
  Object.keys(groups).forEach(k => {
    const list = groups[k];
    const s = computeSeason(list);
    out.push({ key:k, count:list.length, season:s });
  });
  out.sort((a,b) => b.count - a.count);
  return out;
}

function computeTrend(values){
  const n = values.length;
  const min = state.settings.trendMin || DEFAULT_TREND_MIN;
  if (n < min) return null;
  let sx=0, sy=0, sxx=0, sxy=0;
  values.forEach((y, i) => { sx += i; sy += y; sxx += i*i; sxy += i*y; });
  const denom = n*sxx - sx*sx;
  if (denom === 0) return null;
  const slope = (n*sxy - sx*sy) / denom;
  const mean = values.reduce((a,b) => a+b, 0) / n;
  const variance = values.reduce((sum, y) => sum + (y-mean)*(y-mean), 0) / n;
  const std = Math.sqrt(variance);
  const threshold = Math.max(0.15, 0.15 * std);
  return { slope, threshold };
}

function renderTrendCard(label, trendData, unit){
  if (!trendData || !Number.isFinite(trendData.slope)){
    return '<div class="trend-card"><div class="tc-l">' + label + '</div><div class="tc-v flat">—</div></div>';
  }
  const slope = trendData.slope;
  const abs = Math.abs(slope);
  let cls = "flat", arrow = "➖", text = "стабильно";
  if (abs > trendData.threshold && slope > 0){ cls = "up"; arrow = "📈"; text = "рост"; }
  else if (abs > trendData.threshold && slope < 0){ cls = "down"; arrow = "📉"; text = "падение"; }
  const sign = slope >= 0 ? "+" : "";
  const val = sign + slope.toFixed(2) + unit;
  return '<div class="trend-card">' +
    '<div><div class="tc-l">' + label + '</div><div class="tc-d">' + arrow + ' ' + text + '</div></div>' +
    '<div class="tc-v ' + cls + '">' + val + '</div>' +
  '</div>';
}

function computeStreaks(matches){
  const sorted = [...matches].sort((a,b) => (a.date||"").localeCompare(b.date||"") || String(a.id).localeCompare(String(b.id)));
  const out = { eff30:0, ace:0, win:0, positive:0 };
  if (!sorted.length) return out;
  const cm = sorted.map(computeMatch);
  const thEff = state.settings.thresholds.attEff.good;
  const thPos = state.settings.thresholds.posPct.good;

  const isPartial = m => m.result.valid && m.result.partial;

  for (let i = cm.length - 1; i >= 0; i--){
    if (isPartial(cm[i])) break;
    if (cm[i].attEff >= thEff && cm[i].attack.total >= 5) out.eff30++;
    else break;
  }
  for (let i = cm.length - 1; i >= 0; i--){
    if (isPartial(cm[i])) break;
    if (cm[i].serve.aces >= 1) out.ace++;
    else break;
  }
  for (let i = cm.length - 1; i >= 0; i--){
    const r = cm[i].result;
    if (r.valid && !r.partial && !r.draw && r.win) out.win++;
    else break;
  }
  for (let i = cm.length - 1; i >= 0; i--){
    if (isPartial(cm[i])) break;
    if (cm[i].goodPct >= thPos && cm[i].reception.total >= 5) out.positive++;
    else break;
  }
  return out;
}

function computeRecords(matches){
  if (!matches.length) return null;
  const cm = matches.map(computeMatch);
  const pickBest = (key, minFn) => {
    let best = null;
    cm.forEach(m => {
      if (minFn && !minFn(m)) return;
      if (!best || m[key] > best[key]) best = m;
    });
    return best;
  };
  return {
    attEff:  pickBest("attEff",  m => m.attack.total >= 5),
    posPct:  pickBest("goodPct", m => m.reception.total >= 5),
    points:  pickBest("points",  m => m.points > 0),
    pir:     pickBest("pir",     m => Number.isFinite(m.pir))
  };
}

/* ============================================================
   ВАЛИДАЦИЯ
   ============================================================ */
function recValidParts(r){
  return (num(r.positive) + num(r.excellent) + num(r.neutral) + num(r.errors)) <= num(r.total);
}
function validateSetData(s){
  if (!s) return true;
  const a = s.attack || {}, sv = s.serve || {}, r = s.reception || {};
  const attValid = (num(a.kills) + num(a.errors) + num(a.blocked)) <= num(a.total);
  const srvValid = (num(sv.aces) + num(sv.errors)) <= num(sv.total);
  const recValid = recValidParts(r);
  return attValid && srvValid && recValid;
}
function validateSet(s, form){
  if (!s) return true;
  if (!form) return validateSetData(s);
  const a = s.attack || {}, sv = s.serve || {}, r = s.reception || {};
  const attValid = (num(a.kills) + num(a.errors) + num(a.blocked)) <= num(a.total);
  const srvValid = (num(sv.aces) + num(sv.errors)) <= num(sv.total);
  const recValid = recValidParts(r);
  const $ = id => form.querySelector("#" + id);
  const mark = (id, ok) => { const el = $(id); if (el) el.classList.toggle("invalid", !ok); };
  mark("aTotal", attValid); mark("aKills", attValid); mark("aErrors", attValid); mark("aBlocked", attValid);
  mark("sTotal", srvValid); mark("sAces", srvValid); mark("sErrors", srvValid);
  mark("rTotal", recValid); mark("rPositive", recValid); mark("rExcellent", recValid); mark("rNeutral", recValid); mark("rErrors", recValid);
  return attValid && srvValid && recValid;
}

   SVG-ГРАФИКИ
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function svgDesc(text){ const d = svgEl("desc"); d.textContent = text; return d; }

function chartDims(){
  const w = window.innerWidth;
  if (w < 420) return { W:380, H:290, P:{l:48,r:14,t:22,b:46}, fs:11 };
  if (w < 640) return { W:500, H:300, P:{l:54,r:16,t:24,b:48}, fs:11.5 };
  if (w < 900) return { W:680, H:320, P:{l:62,r:20,t:26,b:52}, fs:12.5 };
  return { W:880, H:320, P:{l:70,r:26,t:28,b:56}, fs:13 };
}

function drawLineChart(host, values, opts){
  opts = opts || {};
  host.innerHTML = "";
  const n = values.length;
  if (!n){ host.innerHTML = '<div class="chart-skeleton">Нет данных</div>'; return; }
  const { W, H, P, fs: FS } = chartDims();
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const color = opts.color || COLORS.orange;
  const minBase = (opts.minBase != null) ? opts.minBase : 0;
  const format = opts.format || (v => String(Math.round(v) || 0));
  const gid = opts.gid || ("g_" + Math.random().toString(36).slice(2,8));
  const bgColor = cssVar("--bg");
  const nums = values.map(v => v.value);
  let minV = Math.min(minBase, ...nums);
  let maxV = Math.max(...nums, minBase + 1);
  if (maxV - minV < 1e-9) maxV = minV + 1;
  const span = maxV - minV;
  const top = maxV + span * 0.18;
  const bottom = minV - span * 0.12;
  const y = v => P.t + ih - ((v - bottom) / (top - bottom)) * ih;
  const x = i => P.l + (n === 1 ? iw/2 : (i/(n-1))*iw);
  const svg = svgEl("svg", { viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:"xMidYMid meet", role:"img", "aria-label":opts.aria||"График" });
  svg.appendChild(svgDesc(opts.desc || opts.aria || "График"));
  const defs = svgEl("defs");
  const lg = svgEl("linearGradient", { id:gid, x1:"0", y1:"0", x2:"0", y2:"1" });
  lg.appendChild(svgEl("stop", { offset:"0%", "stop-color":color, "stop-opacity":"0.30" }));
  lg.appendChild(svgEl("stop", { offset:"100%", "stop-color":color, "stop-opacity":"0" }));
  defs.appendChild(lg); svg.appendChild(defs);
  const TICKS = 5;
  for (let k = 0; k < TICKS; k++){
    const val = bottom + (top - bottom) * (k/(TICKS-1));
    const yy = y(val);
    svg.appendChild(svgEl("line", { x1:P.l, x2:W-P.r, y1:yy, y2:yy, stroke:COLORS.grid, "stroke-width":.5, "stroke-opacity":.35 }));
    const t = svgEl("text", { x:P.l-8, y:yy+4, fill:COLORS.muted, "font-size":FS, "text-anchor":"end" });
    t.textContent = format(val);
    svg.appendChild(t);
  }
  if (bottom < 0 && top > 0){
    svg.appendChild(svgEl("line", { x1:P.l, x2:W-P.r, y1:y(0), y2:y(0), stroke:COLORS.grid, "stroke-width":1, "stroke-dasharray":"5 5", "stroke-opacity":.6 }));
  }
  const pts = values.map((v,i) => [x(i), y(v.value)]);
  const linePath = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const baseY = Math.min(P.t + ih, Math.max(P.t, y(0)));
  const areaPath = "M " + pts[0][0].toFixed(1) + " " + baseY.toFixed(1) + " " +
    pts.map(p => "L " + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") +
    " L " + pts[n-1][0].toFixed(1) + " " + baseY.toFixed(1) + " Z";
  svg.appendChild(svgEl("path", { d:areaPath, fill:`url(#${gid})`, stroke:"none" }));
  svg.appendChild(svgEl("path", { d:linePath, fill:"none", stroke:color, "stroke-width":2.6, "stroke-linejoin":"round", "stroke-linecap":"round" }));
  const maxLabels = window.innerWidth < 480 ? 4 : window.innerWidth < 900 ? 6 : 10;
  const step = Math.max(1, Math.ceil(n / maxLabels));
  values.forEach((v,i) => {
    if (i % step !== 0 && i !== n-1) return;
    const t = svgEl("text", { x:x(i), y:H-P.b+FS+11, fill:COLORS.muted, "font-size":FS, "text-anchor":"middle" });
    t.textContent = v.label;
    svg.appendChild(t);
  });
  pts.forEach((p,i) => {
    const c = svgEl("circle", { cx:p[0], cy:p[1], r:4.2, fill:color, stroke:bgColor, "stroke-width":2 });
    const title = svgEl("title");
    title.textContent = values[i].label + " — " + format(values[i].value);
    c.appendChild(title);
    svg.appendChild(c);
  });
  host.appendChild(svg);
}

function drawMultiLineChart(host, series, opts){
  opts = opts || {};
  host.innerHTML = "";
  if (!series.length || !series[0].values.length){ host.innerHTML = '<div class="chart-skeleton">Нет данных</div>'; return; }
  const { W, H, P, fs: FS } = chartDims();
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const n = series[0].values.length;
  const bgColor = cssVar("--bg");
  const allVals = series.flatMap(s => s.values.map(v => v.value));
  const minBase = (opts.minBase != null) ? opts.minBase : 0;
  let minV = Math.min(minBase, ...allVals);
  let maxV = Math.max(...allVals, minBase + 1);
  if (maxV - minV < 1e-9) maxV = minV + 1;
  const span = maxV - minV;
  const top = maxV + span * 0.18;
  const bottom = minV - span * 0.12;
  const y = v => P.t + ih - ((v - bottom)/(top - bottom))*ih;
  const x = i => P.l + (n === 1 ? iw/2 : (i/(n-1))*iw);
  const svg = svgEl("svg", { viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:"xMidYMid meet", role:"img", "aria-label":opts.aria||"График" });
  svg.appendChild(svgDesc(opts.desc || opts.aria || "График"));
  const TICKS = 5;
  for (let k = 0; k < TICKS; k++){
    const val = bottom + (top - bottom) * (k/(TICKS-1));
    const yy = y(val);
    svg.appendChild(svgEl("line", { x1:P.l, x2:W-P.r, y1:yy, y2:yy, stroke:COLORS.grid, "stroke-width":.5, "stroke-opacity":.35 }));
    const t = svgEl("text", { x:P.l-8, y:yy+4, fill:COLORS.muted, "font-size":FS, "text-anchor":"end" });
    t.textContent = (Math.round(val) || 0) + "%";
    svg.appendChild(t);
  }
  if (bottom < 0 && top > 0){
    svg.appendChild(svgEl("line", { x1:P.l, x2:W-P.r, y1:y(0), y2:y(0), stroke:COLORS.grid, "stroke-width":1, "stroke-dasharray":"5 5", "stroke-opacity":.6 }));
  }
  series.forEach(s => {
    const pts = s.values.map((v,i) => [x(i), y(v.value)]);
    const linePath = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    svg.appendChild(svgEl("path", { d:linePath, fill:"none", stroke:s.color, "stroke-width":2.8, "stroke-linejoin":"round", "stroke-linecap":"round" }));
    pts.forEach((p,i) => {
      const c = svgEl("circle", { cx:p[0], cy:p[1], r:4, fill:s.color, stroke:bgColor, "stroke-width":2 });
      const title = svgEl("title");
      title.textContent = s.name + " · " + s.values[i].label + " — " + s.values[i].value.toFixed(1) + "%";
      c.appendChild(title);
      svg.appendChild(c);
    });
  });
  series[0].values.forEach((v,i) => {
    const t = svgEl("text", { x:x(i), y:H-P.b+FS+11, fill:COLORS.muted, "font-size":FS, "text-anchor":"middle" });
    t.textContent = v.label;
    svg.appendChild(t);
  });
  host.appendChild(svg);
}

function drawStackedBars(host, items, opts){
  opts = opts || {};
  host.innerHTML = "";
  const n = items.length;
  if (!n){ host.innerHTML = '<div class="chart-skeleton">Нет данных</div>'; return; }
  const { W, H, P, fs: FS } = chartDims();
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const totals = items.map(it => it.attack + it.serve + it.block);
  const maxRaw = Math.max(1, ...totals);
  const maxV = maxRaw * 1.18;
  const y = v => P.t + ih - (v / maxV) * ih;
  const svg = svgEl("svg", { viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:"xMidYMid meet", role:"img", "aria-label":opts.aria||"Очки по матчам" });
  svg.appendChild(svgDesc(opts.desc || "Стекированный график очков по матчам: атака, подача, блок"));
  const TICKS = 5;
  for (let k = 0; k < TICKS; k++){
    const val = maxV * (k/(TICKS-1));
    const yy = y(val);
    svg.appendChild(svgEl("line", { x1:P.l, x2:W-P.r, y1:yy, y2:yy, stroke:COLORS.grid, "stroke-width":.5, "stroke-opacity":.35 }));
    const t = svgEl("text", { x:P.l-8, y:yy+4, fill:COLORS.muted, "font-size":FS, "text-anchor":"end" });
    t.textContent = String(Math.round(val) || 0);
    svg.appendChild(t);
  }
  const slot = iw / n;
  const barW = Math.min(56, Math.max(6, slot * 0.62));
  items.forEach((it, i) => {
    const cx = P.l + slot*i + slot/2;
    let acc = 0;
    [["attack",COLORS.blue],["serve",COLORS.orange],["block",COLORS.green]].forEach(pair => {
      const val = it[pair[0]];
      if (val <= 0) return;
      const yTop = y(acc + val), yBottom = y(acc);
      const h = Math.max(1, yBottom - yTop);
      svg.appendChild(svgEl("rect", { x:cx-barW/2, y:yTop, width:barW, height:h, fill:pair[1], rx:2 }));
      acc += val;
    });
    const hit = svgEl("rect", { x:cx-slot/2, y:P.t, width:slot, height:ih, fill:"transparent" });
    const title = svgEl("title");
    title.textContent = it.label + " — всего " + (it.attack + it.serve + it.block) +
      " (атака " + it.attack + ", подача " + it.serve + ", блок " + it.block + ")";
    hit.appendChild(title);
    svg.appendChild(hit);
  });
  const maxLabels = window.innerWidth < 480 ? 4 : window.innerWidth < 900 ? 6 : 10;
  const step = Math.max(1, Math.ceil(n / maxLabels));
  items.forEach((it,i) => {
    if (i % step !== 0 && i !== n-1) return;
    const t = svgEl("text", { x:P.l+slot*i+slot/2, y:H-P.b+FS+11, fill:COLORS.muted, "font-size":FS, "text-anchor":"middle" });
    t.textContent = it.label;
    svg.appendChild(t);
  });
  host.appendChild(svg);
}

function chartToPNG(hostEl, filename){
  const svg = hostEl.querySelector("svg");
  if (!svg){ toast("График не найден", "err"); return; }
  const clone = svg.cloneNode(true);
  const vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  const w = vb[2], h = vb[3];
  clone.setAttribute("xmlns", SVGNS);
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  const bgColor = cssVar("--card");
  const bgRect = document.createElementNS(SVGNS, "rect");
  bgRect.setAttribute("width", w); bgRect.setAttribute("height", h); bgRect.setAttribute("fill", bgColor);
  clone.insertBefore(bgRect, clone.firstChild);
  const str = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([str], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = w * scale; canvas.height = h * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(blob => {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename || "chart.png";
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1200);
      URL.revokeObjectURL(url);
      toast("График сохранён", "ok");
    }, "image/png");
  };
  img.onerror = () => { toast("Не удалось сохранить график", "err"); URL.revokeObjectURL(url); };
  img.src = url;
}

function bindFormEvents(){
  const form = document.getElementById("matchForm");
  if (!form) return;
  form.addEventListener("input", e => {
    if (e.target.closest("#setChips")) return;
    if (e.target.id === "sscoreUs" || e.target.id === "sscoreThem"){
      const v = e.target.value;
      if (v !== ""){
        let n = Math.floor(Number(v));
        if (!Number.isFinite(n) || n < 0) n = 0;
        if (n > MAX_SCORE) n = MAX_SCORE;
        if (String(n) !== v) e.target.value = n;
      }
    }
    if (e.target.type === "number" && e.target.id !== "sscoreUs" && e.target.id !== "sscoreThem"){
      const v = e.target.value;
      if (v !== "" && Number(v) < 0) e.target.value = 0;
    }
    captureFormIntoState();
    updatePreview();
    validateSet(formState.sets[formState.activeSetIdx], form);
  });
  form.addEventListener("submit", onSaveMatch);
  document.getElementById("btnClearForm").addEventListener("click", () => {
    if (formState.base.opponent || metrics(aggregateSets(formState.sets)).points > 0){
      if (!confirm("Очистить форму? Введённые данные будут потеряны.")) return;
    }
    resetFormState();
    renderFormMode(true);
    toast("Форма очищена");
  });
  document.getElementById("btnCancelEdit").addEventListener("click", () => {
    resetFormState();
    renderFormMode(true);
    toast("Редактирование отменено");
  });
  document.getElementById("setChips").addEventListener("click", e => {
    if (e.target.closest("#addSetBtn")){ addSet(); return; }
    if (e.target.closest("#delSetBtn")){ deleteCurrentSet(); return; }
    if (e.target.closest("#dupSetBtn")){ duplicatePrevSet(); return; }
    const chip = e.target.closest("[data-set-idx]");
    if (chip) switchSet(Number(chip.dataset.setIdx));
  });
}

function applyFormToDOM(){
  const form = document.getElementById("matchForm");
  if (!form) return;
  setField("mDate", formState.base.date);
  setField("mOpponent", formState.base.opponent);
  setField("mLocation", formState.base.location);
  setField("mTournament", formState.base.tournament);
  setField("mNotes", formState.base.notes);

  loadSetIntoFields(formState.sets[formState.activeSetIdx]);

  validateSet(formState.sets[formState.activeSetIdx], form);
  const title = document.getElementById("formTitle");
  if (title) title.textContent = formState.editingId ? "Редактировать матч" : "Новый матч";
  const cancelBtn = document.getElementById("btnCancelEdit");
  if (cancelBtn) cancelBtn.style.display = formState.editingId ? "inline-flex" : "none";
}
